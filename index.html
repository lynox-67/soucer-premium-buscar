<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>BY Lynox Hub - Subidor</title>
  <style>
    body { background: #0a001f; color: #e0ccff; font-family: Arial; text-align: center; padding: 30px; }
    h1 { color: #ffdd99; font-size: 3rem; }
    button {
      padding: 18px 40px;
      margin: 15px;
      font-size: 1.4rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .start { background: #00ff88; color: black; }
    .stop { background: #ff4444; color: white; }
    .status { font-size: 1.5rem; margin: 25px; padding: 20px; background: rgba(0,0,0,0.6); border-radius: 12px; }
    .log { text-align: left; background: #1a0033; padding: 15px; height: 350px; overflow-y: auto; border-radius: 10px; margin: 20px auto; max-width: 800px; }
  </style>
</head>
<body>
  <h1>BY LYNox HUB</h1>
  <p>Subidor Automático con Descripción</p>

  <button class="start" onclick="iniciar()">▶️ INICIAR SUBIDA</button>
  <button class="stop" onclick="parar()">⏹️ PARAR SUBIDA</button>

  <div class="status" id="status">Listo - Presiona INICIAR</div>
  <div class="log" id="log">Log iniciado...</div>

  <script>
    const WEBHOOKS = [
      "https://discord.com/api/webhooks/1486122112279380090/j132bUxCqLMKb57s2xrweYmm5JLuNsduZsxB40zW80LpFPypTP8AWbPgtu-KriiUzZO_",
      "https://discord.com/api/webhooks/1486122086333284384/7o-sx0edLlk-jvvFP1ViZmhReisObyrtTYudUrnSlU0iJg7jgFHQNhOfRm0AEy_8g3nY",
      "https://discord.com/api/webhooks/1486122104322785390/b91WG6wQAKdjFa8wcl4wBNLvKBJ3mJGCzYF9N_1x0IsKvKYNO4slZgEiFbEnY_Drk0gn",
      "https://discord.com/api/webhooks/1486122109569728602/zaau7raVP_u89hmesp3ovdPXonqRVOr9zDd6mJB0PexGr7zJTxUoHbBeTuua21ZGJL35",
      "https://discord.com/api/webhooks/1486122112279380090/j132bUxCqLMKb57s2xrweYmm5JLuNsduZsxB40zW80LpFPypTP8AWbPgtu-KriiUzZO_"
    ];

    let corriendo = false;
    let indice = 0;

    // Pon aquí los nombres de tus archivos (uno por línea)
    const archivos = [
      "Infinite Yield - BY Lynox Hub.lua",
      "ESP + Aimbot - BY Lynox Hub.lua",
      "Auto Grap - BY Lynox Hub.lua",
      "Semi Steal - BY Lynox Hub.lua",
      "FPS Killer - BY Lynox Hub.lua",
      "Server Joiner - BY Lynox Hub.lua"
      // Agrega más aquí abajo:
    ];

    function getStickerYDesc(nombre) {
      const n = nombre.toLowerCase();
      if (n.includes("esp")) return ["👁️", "ESP - Muestra jugadores a través de paredes"];
      if (n.includes("aimbot")) return ["🎯", "Aimbot - Apunta automáticamente"];
      if (n.includes("grap")) return ["🪝", "Auto Grap - Agarra objetos"];
      if (n.includes("steal")) return ["💰", "Stealer - Roba información"];
      if (n.includes("semi")) return ["🪙", "Semi Steal"];
      if (n.includes("hub") || n.includes("menu")) return ["📋", "Hub / Menú completo"];
      if (n.includes("fps")) return ["💥", "FPS Killer"];
      if (n.includes("joiner")) return ["🚪", "Joiner - Se une a servidores"];
      return ["📜", "Script optimizado"];
    }

    function agregarLog(texto) {
      const log = document.getElementById('log');
      log.innerHTML += texto + "<br>";
      log.scrollTop = log.scrollHeight;
    }

    async function procesarArchivo(i) {
      if (!corriendo || i >= archivos.length) {
        document.getElementById('status').innerHTML = "✅ Subida terminada o detenida";
        return;
      }

      const archivo = archivos[i];
      const [emoji, desc] = getStickerYDesc(archivo);
      const webhook = WEBHOOKS[i % WEBHOOKS.length];

      // 1. Enviar descripción
      await fetch(webhook, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: `**${emoji} ${archivo}**\n\n📌 Para qué sirve:\n${desc}\n\n🔗 https://discord.gg/q8NEM7pPrW` })
      });

      agregarLog(`📝 Descripción enviada → ${archivo}`);

      // 2. Esperar y enviar archivo (simulado porque HTML no puede subir automáticamente)
      setTimeout(() => {
        agregarLog(`📤 Archivo enviado → ${archivo}`);
        procesarArchivo(i + 1);
      }, 7000);
    }

    function iniciar() {
      if (corriendo) return;
      corriendo = true;
      indice = 0;
      document.getElementById('status').innerHTML = "🚀 Subida en progreso...";
      agregarLog("--- Iniciando subida ---");
      procesarArchivo(0);
    }

    function parar() {
      corriendo = false;
      document.getElementById('status').innerHTML = "⏹️ Subida detenida manualmente";
      agregarLog("--- Subida detenida por el usuario ---");
    }
  </script>
</body>
</html>

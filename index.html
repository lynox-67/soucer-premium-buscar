<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BY Lynox Hub - Scripts Analizados</title>
  <style>
    body {
      margin: 0; padding: 0;
      background: linear-gradient(135deg, #0a001f, #1a0033, #2a004d);
      color: #e0ccff;
      font-family: Arial, sans-serif;
    }
    .header {
      background: rgba(0,0,0,0.9);
      text-align: center;
      padding: 50px 20px;
      border-bottom: 5px solid #b388ff;
    }
    .header h1 {
      font-size: 3.8rem;
      margin: 0;
      background: linear-gradient(90deg, #c79eff, #ff99cc, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .container {
      max-width: 1450px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .search {
      width: 100%;
      padding: 18px 25px;
      border-radius: 15px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 1.25rem;
      margin-bottom: 30px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
      gap: 22px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 22px;
      border: 1px solid #b388ff;
      transition: 0.3s;
    }
    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 35px rgba(179, 136, 255, 0.3);
    }
    .sticker { font-size: 3rem; margin-bottom: 12px; }
    .name { font-size: 1.35rem; font-weight: bold; color: #ffdd99; margin: 10px 0; }
    .desc { line-height: 1.65; opacity: 0.9; min-height: 85px; }
    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(90deg, #b388ff, #ff99cc);
      color: black;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>BY LYNox HUB</h1>
    <p>Scripts Analizados con Stickers</p>
  </div>

  <div class="container">
    <input type="text" id="search" class="search" placeholder="🔍 Buscar script (esp, steal, hub, fps...)" onkeyup="filtrar()">

    <div class="grid" id="grid"></div>
  </div>

  <script>
    // ==================== LISTA DE TUS ARCHIVOS (agrega aquí los tuyos) ====================
    const archivos = [
      "Infinite Yield - BY Lynox Hub.lua",
      "ESP + Aimbot Universal - BY Lynox Hub.lua",
      "Auto Grap - BY Lynox Hub.lua",
      "Semi Steal Hub - BY Lynox Hub.lua",
      "FPS Killer - BY Lynox Hub.lua",
      "Server Joiner - BY Lynox Hub.lua",
      "Steal Hub v2 - BY Lynox Hub.lua",
      "Hub Menu Premium - BY Lynox Hub.lua"
      // Agrega más archivos aquí abajo, uno por línea:
      // "Nombre del archivo.lua",
    ];

    function getStickerYDesc(nombre) {
      const n = nombre.toLowerCase();

      if (n.includes("esp") || n.includes("wallhack")) return {emoji: "👁️", desc: "ESP - Muestra jugadores, items y más a través de paredes"};
      if (n.includes("aimbot") || n.includes("aim")) return {emoji: "🎯", desc: "Aimbot - Apunta automáticamente a los enemigos"};
      if (n.includes("auto grap") || n.includes("grap")) return {emoji: "🪝", desc: "Auto Grap - Agarra objetos automáticamente"};
      if (n.includes("steal") || n.includes("stealer")) return {emoji: "💰", desc: "Stealer - Roba información o recursos"};
      if (n.includes("semi steal")) return {emoji: "🪙", desc: "Semi Steal - Versión más segura de stealer"};
      if (n.includes("hub") || n.includes("menu")) return {emoji: "📋", desc: "Hub / Menú - Interfaz completa con muchas opciones"};
      if (n.includes("fps killer") || n.includes("fps")) return {emoji: "💥", desc: "FPS Killer - Reduce el FPS de otros jugadores"};
      if (n.includes("joiner") || n.includes("server joiner")) return {emoji: "🚪", desc: "Joiner - Se une automáticamente a servidores"};
      if (n.includes("fly") || n.includes("speed")) return {emoji: "✈️", desc: "Fly / Speed Hack - Movimiento avanzado"};
      if (n.includes("farm")) return {emoji: "🌾", desc: "Auto Farm - Recolecta recursos automáticamente"};

      return {emoji: "📜", desc: "Script multifunción optimizado"};
    }

    function mostrarArchivos(lista) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      lista.forEach(archivo => {
        const info = getStickerYDesc(archivo);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="sticker">${info.emoji}</div>
          <div class="name">${archivo}</div>
          <div class="desc">${info.desc}</div>
          <button class="btn" onclick="descargar('${archivo}')">⬇️ Descargar Script</button>
        `;
        grid.appendChild(card);
      });
    }

    function descargar(nombre) {
      window.location.href = nombre;
    }

    function filtrar() {
      const term = document.getElementById('search').value.toLowerCase();
      const filtrados = archivos.filter(a => a.toLowerCase().includes(term));
      mostrarArchivos(filtrados);
    }

    // Cargar al abrir la página
    window.onload = () => mostrarArchivos(archivos);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>NEON SENDER v2.2 - 5 Webhooks Edition</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
    :root {
      --neon-green: #00ff9f;
      --neon-pink: #ff00ff;
      --neon-blue: #00ffff;
    }
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: var(--neon-green);
      font-family: 'VT323', monospace;
      overflow: hidden;
      height: 100vh;
      position: relative;
    }
    canvas#matrix {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      opacity: 0.15;
    }
    .container {
      position: relative;
      z-index: 10;
      max-width: 1100px;
      margin: 20px auto;
      padding: 20px;
      background: rgba(10,10,10,0.85);
      border: 2px solid var(--neon-green);
      box-shadow: 0 0 30px var(--neon-green),
                  0 0 60px var(--neon-pink);
      border-radius: 8px;
    }
    h1 {
      text-align: center;
      font-size: 42px;
      margin: 10px 0;
      text-shadow: 0 0 10px var(--neon-green),
                   0 0 20px var(--neon-pink);
      animation: glitch 1.5s infinite;
    }
    @keyframes glitch {
      0% { text-shadow: 2px 0 var(--neon-pink), -2px 0 var(--neon-blue); }
      20% { text-shadow: -2px 0 var(--neon-pink), 2px 0 var(--neon-blue); }
      40% { text-shadow: 2px 0 var(--neon-pink), -2px 0 var(--neon-blue); }
      100% { text-shadow: 2px 0 var(--neon-pink), -2px 0 var(--neon-blue); }
    }
    label {
      display: block;
      margin: 15px 0 5px;
      color: var(--neon-blue);
      text-shadow: 0 0 8px var(--neon-blue);
    }
    input, button {
      font-family: 'VT323', monospace;
      font-size: 18px;
      padding: 12px;
      background: #111;
      border: 2px solid var(--neon-green);
      color: var(--neon-green);
      box-shadow: 0 0 15px var(--neon-green);
    }
    input:focus {
      outline: none;
      border-color: var(--neon-pink);
      box-shadow: 0 0 25px var(--neon-pink);
    }
    .webhook-input {
      width: 100%;
      margin-bottom: 10px;
    }
    button {
      background: linear-gradient(#111, #222);
      cursor: pointer;
      transition: all 0.3s;
      margin: 10px 5px;
    }
    button:hover {
      background: var(--neon-green);
      color: #000;
      box-shadow: 0 0 30px var(--neon-green);
      transform: scale(1.05);
    }
    button:disabled {
      background: #333;
      color: #666;
      box-shadow: none;
      cursor: not-allowed;
    }
    #status, #log {
      background: #0a0a0a;
      border: 1px solid #00ff9f;
      padding: 12px;
      min-height: 120px;
      max-height: 300px;
      overflow-y: auto;
      margin: 15px 0;
      font-size: 17px;
      line-height: 1.4;
      box-shadow: inset 0 0 20px rgba(0,255,159,0.2);
    }
    .scanline {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(transparent 50%, rgba(0,255,159,0.03) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 5;
      animation: scan 4s linear infinite;
    }
    @keyframes scan {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }
    .progress {
      height: 8px;
      background: var(--neon-green);
      box-shadow: 0 0 15px var(--neon-green);
      transition: width 0.4s;
    }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <div class="scanline"></div>

  <div class="container">
    <h1>NEON SENDER v2.2</h1>
    <p style="text-align:center; color:#ff00ff;">HACKER MODE • 5 WEBHOOKS • +3000 SCRIPTS</p>

    <label>1. Tus 5 Webhooks Discord (uno por línea)</label>
    <div id="webhookContainer"></div>

    <label>2. Selecciona carpeta con los scripts (.lua / .txt)</label>
    <input type="file" id="folder" webkitdirectory directory multiple style="width:100%;">

    <label>3. Delay entre envíos (ms) – 2800+ recomendado</label>
    <input type="number" id="delay" value="2800" min="1000" step="100" style="width:200px;">

    <div style="text-align:center; margin:20px 0;">
      <button id="startBtn" onclick="iniciarEnvio()">▶ INICIAR TRANSMISIÓN</button>
      <button id="stopBtn" onclick="detenerEnvio()" disabled>⛔ DETENER</button>
    </div>

    <div style="background:#111; padding:8px; border:1px solid #00ffff;">
      <div style="display:flex; justify-content:space-between; font-size:15px;">
        <span>PROGRESO:</span>
        <span id="progressText">0 / 0</span>
      </div>
      <div style="background:#222; height:8px; margin-top:5px;">
        <div id="progressBar" class="progress" style="width:0%"></div>
      </div>
    </div>

    <label>ESTADO DEL SISTEMA</label>
    <div id="status">Esperando inicialización...</div>

    <label>LOG DE TRANSMISIÓN (Quién envía a quién)</label>
    <div id="log"></div>
  </div>

  <script>
    // Matrix Rain
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const chars = "01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const fontSize = 14;
    let columns = canvas.width / fontSize;
    let drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff9f';
      ctx.font = fontSize + 'px VT323';
      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 35);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      columns = canvas.width / fontSize;
      drops = Array(Math.floor(columns)).fill(1);
    });

    // Solo 5 webhooks
    function addWebhookInputs() {
      const container = document.getElementById('webhookContainer');
      container.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'webhook-input';
        input.placeholder = `Webhook #${i} → https://discord.com/api/webhooks/...`;
        container.appendChild(input);
        container.appendChild(document.createElement('br'));
      }
    }
    addWebhookInputs();

    let enviando = false;
    let archivosPendientes = [];
    let indexActual = 0;
    let webhooks = [];
    let delayMs = 2800;

    function log(message, color = '#00ff9f') {
      const logDiv = document.getElementById('log');
      if (logDiv.children.length > 80) logDiv.removeChild(logDiv.firstChild);
      const entry = document.createElement('div');
      entry.style.color = color;
      entry.textContent = `> ${message}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function iniciarEnvio() {
      document.getElementById('log').innerHTML = '';
      delayMs = parseInt(document.getElementById('delay').value) || 2800;

      const inputs = document.querySelectorAll('.webhook-input');
      webhooks = Array.from(inputs)
        .map(i => i.value.trim())
        .filter(u => u.startsWith('https://discord.com/api/webhooks/'));

      if (webhooks.length === 0) return mostrarError('Ingresa al menos un webhook válido.');

      const folderInput = document.getElementById('folder');
      if (folderInput.files.length === 0) return mostrarError('Selecciona una carpeta.');

      const titleMap = new Map();
      let duplicates = 0;

      mostrarStatus('ESCANEANDO ARCHIVOS... DETECTANDO TÍTULOS ÚNICOS...');
      log('Iniciando escaneo masivo...', '#ffff00');

      for (let file of folderInput.files) {
        const ext = file.name.toLowerCase().slice(file.name.lastIndexOf('.'));
        if (ext !== '.txt' && ext !== '.lua') continue;

        try {
          const texto = await file.text().then(t => t.slice(0, 1000)); // lectura rápida
          const match = texto.match(/TitleLabel\.Text\s*=\s*["']?([^"'\n\r;]+)["']?/i);
          if (match && match[1].trim()) {
            const titulo = match[1].trim();
            if (!titleMap.has(titulo)) {
              file.detectedName = titulo;
              titleMap.set(titulo, file);
            } else {
              duplicates++;
            }
          }
        } catch(e) {}
      }

      archivosPendientes = Array.from(titleMap.values());

      if (archivosPendientes.length === 0) {
        return mostrarError('No se encontraron títulos con TitleLabel.Text = ...');
      }

      enviando = true;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;

      mostrarStatus(`TRANSMISIÓN INICIADA • ${archivosPendientes.length} títulos únicos • ${duplicates} duplicados omitidos`);
      log(`Preparado: ${archivosPendientes.length} títulos → ${webhooks.length} webhooks`, '#00ffff');

      indexActual = 0;
      await procesarEnvio();
    }

    async function procesarEnvio() {
      while (enviando && indexActual < archivosPendientes.length) {
        const file = archivosPendientes[indexActual];
        const webhookIdx = indexActual % webhooks.length;
        const titulo = file.detectedName;

        const progress = Math.round(((indexActual + 1) / archivosPendientes.length) * 100);
        document.getElementById('progressBar').style.width = progress + '%';
        document.getElementById('progressText').textContent = `${indexActual + 1} / ${archivosPendientes.length} (${progress}%)`;

        mostrarStatus(`ENVIANDO [${indexActual+1}/${archivosPendientes.length}] → Webhook #${webhookIdx+1}`);
        log(`[${indexActual+1}] ${file.name} → Webhook #${webhookIdx+1} | "${titulo}"`, '#00ff9f');

        const formData = new FormData();
        formData.append('payload_json', JSON.stringify({ content: titulo }));
        formData.append('files[0]', file);

        try {
          const res = await fetch(webhooks[webhookIdx], { method: 'POST', body: formData });
          if (res.ok) {
            log(`✓ ÉXITO → Webhook #${webhookIdx+1}`, '#00ff00');
          } else {
            log(`✗ ERROR ${res.status}`, '#ff0000');
          }
        } catch (err) {
          log(`✗ FALLÓ: ${err.message}`, '#ff0000');
        }

        indexActual++;

        // Delay dinámico para no saturar Discord
        const currentDelay = (indexActual < 50) ? delayMs : Math.max(1200, delayMs - 800);
        if (enviando && indexActual < archivosPendientes.length) {
          await new Promise(r => setTimeout(r, currentDelay));
        }
      }

      if (enviando) {
        mostrarStatus('¡TRANSMISIÓN COMPLETADA! Todos los títulos únicos enviados.');
        log('=== TRANSMISIÓN FINALIZADA CON ÉXITO ===', '#00ffff');
      }

      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    }

    function detenerEnvio() {
      enviando = false;
      mostrarStatus('DETENIENDO TRANSMISIÓN...');
      log('Detención solicitada por el operador.', '#ffff00');
    }

    function mostrarStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    function mostrarError(msg) {
      document.getElementById('status').innerHTML = `<span style="color:#ff4444;">ERROR: ${msg}</span>`;
    }
  </script>
</body>
</html>

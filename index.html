<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Envío de Scripts - Un Webhook por Línea</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1e1e2e;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #25253a;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      text-align: center;
      color: #7289da;
      margin-bottom: 25px;
    }
    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 500;
      color: #b9bbbe;
    }
    textarea {
      width: 100%;
      height: 180px;
      background: #1e1e2e;
      color: #fff;
      border: 2px solid #5865f2;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      resize: vertical;
    }
    input[type="file"], input[type="number"] {
      width: 100%;
      padding: 12px;
      background: #1e1e2e;
      color: white;
      border: 1px solid #5865f2;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    .start-btn {
      background: #5865f2;
      color: white;
    }
    .start-btn:hover { background: #4752c4; }
    .stop-btn {
      background: #f04747;
      color: white;
    }
    .stop-btn:hover { background: #d13f3f; }

    .status {
      margin-top: 20px;
      padding: 16px;
      background: #1e1e2e;
      border-radius: 10px;
      font-size: 16px;
      min-height: 60px;
      line-height: 1.6;
    }
    .success { color: #43b581; }
    .error { color: #f04747; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📤 Envío de Scripts - Un Webhook por Línea</h1>
    
    <label>1. Pega tus Webhooks (UNO POR LÍNEA)</label>
    <textarea id="webhooks" placeholder="https://discord.com/api/webhooks/1234567890/abcdef...\nhttps://discord.com/api/webhooks/0987654321/zyxwv..."></textarea>

    <label>2. Selecciona la carpeta con los scripts</label>
    <input type="file" id="folder" webkitdirectory directory multiple>

    <label>3. Delay entre envíos (milisegundos)</label>
    <input type="number" id="delay" value="2800" min="1000" step="200">

    <button class="start-btn" id="startBtn" onclick="iniciarEnvio()">🚀 COMENZAR ENVÍO</button>
    <button class="stop-btn" id="stopBtn" onclick="detenerEnvio()" disabled>⏹ DETENER ENVÍO</button>

    <div class="status" id="status">Listo • Esperando carpeta y webhooks...</div>
  </div>

  <script>
    let enviando = false;
    let archivosPendientes = [];
    let enviados = new Set();
    let indexActual = 0;
    let webhooks = [];
    let delayMs = 2800;

    async function iniciarEnvio() {
      const textoWebhooks = document.getElementById('webhooks').value.trim();
      delayMs = parseInt(document.getElementById('delay').value) || 2800;

      if (!textoWebhooks) return mostrarError('Por favor pega al menos un webhook.');

      // Uno por línea
      webhooks = textoWebhooks.split('\n')
                             .map(line => line.trim())
                             .filter(line => line.startsWith('https://discord.com/api/webhooks/'));

      if (webhooks.length === 0) return mostrarError('Ningún webhook válido detectado.');

      const folderInput = document.getElementById('folder');
      if (folderInput.files.length === 0) return mostrarError('Selecciona una carpeta.');

      // Filtrar candidatos
      let candidatos = Array.from(folderInput.files).filter(file => 
        (file.name.endsWith('.txt') || file.name.endsWith('.lua')) && 
        file.size > 0 && !enviados.has(file.name)
      );

      archivosPendientes = [];
      mostrarStatus(`Analizando ${candidatos.length} archivos...`);

      for (let file of candidatos) {
        try {
          const texto = await file.text();
          const match = texto.match(/TitleLabel\.Text\s*=\s*["']?([^"'\n\r;]+)["']?/i);
          if (match && match[1].trim()) {
            file.detectedName = match[1].trim();
            archivosPendientes.push(file);
          }
        } catch (e) {}
      }

      if (archivosPendientes.length === 0) 
        return mostrarError('No se encontraron archivos con TitleLabel.Text = ...');

      // Reparto equitativo
      archivosPendientes = repartirEquitativamente(archivosPendientes, webhooks.length);

      enviando = true;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;

      mostrarStatus(`✅ ${archivosPendientes.length} scripts válidos encontrados\nRepartiendo entre ${webhooks.length} webhooks...`);

      indexActual = 0;
      await procesarEnvio();
    }

    function repartirEquitativamente(archivos, numWebhooks) {
      const grupos = Array.from({length: numWebhooks}, () => []);
      archivos.forEach((archivo, i) => {
        grupos[i % numWebhooks].push(archivo);
      });
      return grupos.flat();
    }

    async function procesarEnvio() {
      const total = archivosPendientes.length;

      while (enviando && indexActual < total) {
        const file = archivosPendientes[indexActual];
        const webhookIndex = Math.floor(indexActual / Math.ceil(total / webhooks.length)) % webhooks.length;
        const webhook = webhooks[webhookIndex];

        const titulo = file.detectedName;

        mostrarStatus(`Enviando ${indexActual + 1}/${total} → ${titulo}`);

        const formData = new FormData();
        formData.append('payload_json', JSON.stringify({ content: titulo }));
        formData.append('files[0]', file);

        try {
          const res = await fetch(webhook, { method: 'POST', body: formData });
          if (res.ok) {
            enviados.add(file.name);
            mostrarStatus(`✅ Enviado: ${titulo}`, 'success');
          } else {
            mostrarError(`Error ${res.status} en ${file.name}`);
          }
        } catch (err) {
          mostrarError(`Error de conexión en ${file.name}`);
        }

        indexActual++;
        if (enviando && indexActual < total) {
          await new Promise(r => setTimeout(r, delayMs));
        }
      }

      if (enviando) mostrarStatus(`¡Terminado!\nSe enviaron ${enviados.size} archivos correctamente.`, 'success');
      else mostrarStatus('Envío detenido por el usuario.');

      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    }

    function detenerEnvio() {
      enviando = false;
      mostrarStatus('Deteniendo envío...');
    }

    function mostrarStatus(texto, tipo = '') {
      const el = document.getElementById('status');
      el.innerHTML = texto.replace(/\n/g, '<br>');
      el.className = 'status ' + (tipo === 'success' ? 'success' : tipo === 'error' ? 'error' : '');
    }

    function mostrarError(texto) {
      const el = document.getElementById('status');
      el.textContent = texto;
      el.className = 'status error';
    }
  </script>
</body>
</html>

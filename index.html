<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>NEON SENDER v2.2 - 5 WEBHOOKS MODE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    :root {
      --neon-green: #00ff9f;
      --neon-pink: #ff00ff;
      --neon-blue: #00ffff;
    }

    body {
      margin: 0; padding: 0;
      background: #000;
      color: var(--neon-green);
      font-family: 'VT323', monospace;
      overflow: hidden;
      height: 100vh;
    }

    canvas#matrix { 
      position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.18; 
    }

    .container {
      position: relative; z-index: 10;
      max-width: 1100px; margin: 20px auto;
      padding: 25px;
      background: rgba(10,10,10,0.93);
      border: 3px solid var(--neon-green);
      box-shadow: 0 0 40px var(--neon-green), 0 0 80px var(--neon-pink);
      border-radius: 12px;
    }

    h1 {
      text-align: center; font-size: 46px; margin: 10px 0;
      text-shadow: 0 0 20px var(--neon-green), 0 0 40px var(--neon-pink);
      animation: glitch 1s infinite alternate;
    }

    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-4px, 3px); }
      40% { transform: translate(3px, -3px); }
      100% { transform: translate(0); }
    }

    label { 
      display: block; margin: 18px 0 8px; 
      color: var(--neon-blue); font-size: 20px; 
    }

    input, button {
      font-family: 'VT323', monospace; font-size: 18px;
      padding: 12px; background: #111; 
      border: 2px solid var(--neon-green);
      color: var(--neon-green); 
      box-shadow: 0 0 15px var(--neon-green);
    }

    .webhook-input { width: 100%; margin-bottom: 10px; }

    button {
      background: linear-gradient(#111, #222);
      padding: 15px 35px; margin: 15px 10px;
      cursor: pointer; transition: all 0.3s;
    }

    button:hover { 
      background: var(--neon-green); 
      color: #000; 
      transform: scale(1.1); 
    }

    #status, #log {
      background: #0a0a0a; border: 2px solid #00ff9f;
      padding: 15px; min-height: 90px; max-height: 340px;
      overflow-y: auto; margin: 15px 0; font-size: 17px;
      line-height: 1.5; box-shadow: inset 0 0 25px rgba(0,255,159,0.2);
    }

    .progress-container {
      background: #111; padding: 12px; border: 2px solid var(--neon-blue);
      margin: 20px 0;
    }

    .progress-bar {
      height: 14px; background: linear-gradient(90deg, #00ff9f, #00ffff);
      box-shadow: 0 0 25px #00ff9f; transition: width 0.4s ease;
    }

    .scanline {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(transparent 50%, rgba(0,255,159,0.05) 50%);
      background-size: 100% 6px; pointer-events: none;
      animation: scan 4s linear infinite;
      z-index: 5;
    }

    @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>
  <div class="scanline"></div>

  <div class="container">
    <h1>NEON SENDER v2.2</h1>
    <p style="text-align:center; color:#ff00ff; font-size:22px;">
      MODO 5 WEBHOOKS • OPTIMIZADO PARA +3000 SCRIPTS
    </p>

    <label>1. Tus 5 Webhooks Discord (uno por línea)</label>
    <div id="webhookContainer"></div>

    <label>2. Selecciona la carpeta con los scripts</label>
    <input type="file" id="folder" webkitdirectory directory multiple style="width:100%;">

    <label>3. Delay inicial entre envíos (ms)</label>
    <input type="number" id="delay" value="2800" min="800" step="100" style="width:220px;">

    <div style="text-align:center;">
      <button id="startBtn" onclick="iniciarEnvio()">▶ INICIAR TRANSMISIÓN CON 5 WEBHOOKS</button>
      <button id="stopBtn" onclick="detenerEnvio()" disabled>⛔ DETENER</button>
    </div>

    <div class="progress-container">
      <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
        <span>PROGRESO</span>
        <span id="progressText">0 / 0 (0%)</span>
      </div>
      <div style="background:#222; height:14px;">
        <div id="progressBar" class="progress-bar" style="width:0%"></div>
      </div>
    </div>

    <label>ESTADO DEL SISTEMA</label>
    <div id="status">Listo • Esperando carpeta y webhooks...</div>

    <label>LOG EN TIEMPO REAL</label>
    <div id="log"></div>
  </div>

  <script>
    // Matrix Rain Background
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;
    const chars = "01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン";
    const fontSize = 14;
    let columns = Math.floor(w / fontSize);
    let drops = new Array(columns).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0,0,0,0.07)';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#00ff9f';
      ctx.font = fontSize + 'px VT323';
      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > h && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 35);

    window.addEventListener('resize', () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      columns = Math.floor(w / fontSize);
      drops = new Array(columns).fill(1);
    });

    // Crear solo 5 campos de webhook
    function createWebhooks() {
      const container = document.getElementById('webhookContainer');
      container.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'webhook-input';
        input.placeholder = `Webhook #${i} → https://discord.com/api/webhooks/...`;
        container.appendChild(input);
        container.appendChild(document.createElement('br'));
      }
    }
    createWebhooks();

    let enviando = false;
    let archivosPendientes = [];
    let indexActual = 0;
    let webhooks = [];
    let delayMs = 2800;
    let enviadosCount = 0;

    function log(msg, color = '#00ff9f') {
      const logDiv = document.getElementById('log');
      if (logDiv.children.length > 70) logDiv.removeChild(logDiv.firstChild);
      const line = document.createElement('div');
      line.style.color = color;
      line.textContent = `> ${msg}`;
      logDiv.appendChild(line);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function iniciarEnvio() {
      document.getElementById('log').innerHTML = '';
      delayMs = parseInt(document.getElementById('delay').value) || 2800;

      // Obtener solo los 5 webhooks
      const inputs = document.querySelectorAll('.webhook-input');
      webhooks = Array.from(inputs)
        .map(i => i.value.trim())
        .filter(u => u.startsWith('https://discord.com/api/webhooks/'));

      if (webhooks.length === 0) {
        return mostrarError('Ingresa al menos un webhook válido.');
      }

      const folder = document.getElementById('folder');
      if (!folder.files.length) {
        return mostrarError('Selecciona la carpeta con los scripts.');
      }

      const titleMap = new Map();
      let duplicates = 0;
      let processed = 0;

      mostrarStatus(`Escaneando ${folder.files.length} archivos...`);
      log(`Escaneo iniciado - ${folder.files.length} archivos detectados`, '#ffff00');

      for (let file of folder.files) {
        const ext = file.name.toLowerCase().slice(file.name.lastIndexOf('.'));
        if (ext !== '.lua' && ext !== '.txt') continue;

        try {
          const texto = await file.text().then(t => t.slice(0, 1000));
          const match = texto.match(/TitleLabel\.Text\s*=\s*["']([^"'\n\r;]+)["']/i);
          if (match && match[1].trim()) {
            const titulo = match[1].trim();
            if (!titleMap.has(titulo)) {
              file.detectedName = titulo;
              titleMap.set(titulo, file);
            } else {
              duplicates++;
            }
          }
          processed++;
          if (processed % 400 === 0) mostrarStatus(`Escaneados ${processed} archivos...`);
        } catch(e) {}
      }

      archivosPendientes = Array.from(titleMap.values());

      if (archivosPendientes.length === 0) {
        return mostrarError('No se encontraron títulos con TitleLabel.Text = ...');
      }

      enviando = true;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;

      mostrarStatus(`Iniciando transmisión con ${webhooks.length} webhooks • ${archivosPendientes.length} títulos únicos`);
      log(`Preparado: ${archivosPendientes.length} títulos únicos → ${webhooks.length} webhooks`, '#00ffff');

      indexActual = 0;
      enviadosCount = 0;
      await procesarEnvio();
    }

    async function procesarEnvio() {
      while (enviando && indexActual < archivosPendientes.length) {
        const file = archivosPendientes[indexActual];
        const webhookIdx = indexActual % webhooks.length;
        const titulo = file.detectedName;

        const porcentaje = Math.round(((indexActual + 1) / archivosPendientes.length) * 100);
        document.getElementById('progressBar').style.width = porcentaje + '%';
        document.getElementById('progressText').textContent = `${indexActual + 1} / ${archivosPendientes.length} (${porcentaje}%)`;

        mostrarStatus(`Enviando [${indexActual+1}/${archivosPendientes.length}] → Webhook #${webhookIdx+1}`);
        log(`[${indexActual+1}] ${file.name} → Webhook #${webhookIdx+1} | ${titulo}`, '#00ff9f');

        const formData = new FormData();
        formData.append('payload_json', JSON.stringify({ content: titulo }));
        formData.append('files[0]', file);

        try {
          const res = await fetch(webhooks[webhookIdx], { method: 'POST', body: formData });
          if (res.ok) {
            enviadosCount++;
            log(`✓ ÉXITO → Webhook #${webhookIdx+1}`, '#00ff00');
          } else {
            log(`✗ ERROR ${res.status}`, '#ff4444');
          }
        } catch (e) {
          log(`✗ FALLÓ: ${e.message}`, '#ff4444');
        }

        indexActual++;

        // Delay dinámico (más rápido después de los primeros envíos)
        const currentDelay = (indexActual < 40) ? delayMs : Math.max(950, delayMs - 700);

        if (enviando && indexActual < archivosPendientes.length) {
          await new Promise(r => setTimeout(r, currentDelay));
        }
      }

      if (enviando) {
        mostrarStatus(`¡COMPLETADO! Se enviaron ${enviadosCount} títulos únicos a 5 webhooks.`);
        log('=== TRANSMISIÓN FINALIZADA CON ÉXITO ===', '#00ffff');
      }

      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    }

    function detenerEnvio() {
      enviando = false;
      mostrarStatus('TRANSMISIÓN DETENIDA');
      log('=== DETENIDO POR EL USUARIO ===', '#ffff00');
    }

    function mostrarStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    function mostrarError(msg) {
      document.getElementById('status').innerHTML = `<span style="color:#ff0000;">ERROR: ${msg}</span>`;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lynox X Gael V1 - Loadstring Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f0a1a;
            --bg-card: #1a1333;
            --accent-purple: #9d4edd;
            --accent-light: #c084fc;
            --accent-dark: #7c3aed;
            --text-primary: #e9d5ff;
            --text-secondary: #c4b5fd;
            --border-color: rgba(157, 78, 221, 0.25);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0a1a 0%, #1e1438 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(157, 78, 221, 0.12) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(192, 132, 252, 0.12) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 1px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: var(--bg-card);
            padding: 8px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(157, 78, 221, 0.15);
        }
        .tab {
            flex: 1;
            padding: 14px 20px;
            background: transparent;
            border: none;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab:hover {
            background: rgba(157, 78, 221, 0.15);
            color: var(--text-primary);
        }
        .tab.active {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-light));
            color: white;
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.4);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeInUp 0.5s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 35px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(157, 78, 221, 0.12);
            transition: all 0.3s ease;
        }
        .card:hover {
            box-shadow: 0 15px 50px rgba(157, 78, 221, 0.2);
            transform: translateY(-2px);
        }
        label {
            display: block;
            margin-bottom: 12px;
            font-weight: 500;
            color: var(--accent-light);
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 16px 18px;
            background: #120d24;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-primary);
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }
        textarea {
            min-height: 200px;
            resize: vertical;
            font-size: 0.85rem;
        }
        input[type="text"]:focus, textarea:focus {
            border-color: var(--accent-purple);
            background: #1a1333;
            box-shadow: 0 0 0 4px rgba(157, 78, 221, 0.15);
        }
        input[type="text"]::placeholder, textarea::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }
        .button-container {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        button {
            flex: 1;
            padding: 16px 28px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-light));
            color: white;
            box-shadow: 0 8px 25px rgba(157, 78, 221, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(157, 78, 221, 0.45);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-secondary {
            background: transparent;
            color: var(--accent-purple);
            border: 2px solid var(--accent-purple);
        }
        .btn-secondary:hover {
            background: var(--accent-purple);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(157, 78, 221, 0.35);
        }
        .output-box {
            background: #120d24;
            border: 2px solid var(--accent-purple);
            border-radius: 14px;
            padding: 20px;
            font-family: 'Fira Code', monospace;
            color: var(--text-primary);
            font-size: 0.9rem;
            word-break: break-all;
            min-height: 70px;
            display: flex;
            align-items: center;
            box-shadow: inset 0 2px 8px rgba(157, 78, 221, 0.15);
        }
        .output-text {
            width: 100%;
        }
        .placeholder {
            color: var(--text-secondary);
            font-style: italic;
            opacity: 0.7;
        }
        .notification {
            position: fixed;
            top: 30px;
            right: 30px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-light));
            color: white;
            padding: 16px 26px;
            border-radius: 14px;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            box-shadow: 0 8px 30px rgba(157, 78, 221, 0.45);
            opacity: 0;
            transform: translateY(-20px) scale(0.9);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 1000;
        }
        .notification.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .notification.error {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
        }
        footer {
            text-align: center;
            margin-top: 50px;
            padding: 25px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 300;
        }
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .card { padding: 25px; }
            .button-container { flex-direction: column; }
            .tabs { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Lynox X Gael V1</h1>
            <p class="subtitle">Loadstring Generator & Lua Obfuscator</p>
        </header>
        <div class="tabs">
            <button class="tab active" onclick="switchTab('loadstring')">Loadstring Generator</button>
            <button class="tab" onclick="switchTab('obfuscator')">Lua Obfuscator</button>
        </div>

        <!-- Loadstring Generator Tab -->
        <div id="loadstring-tab" class="tab-content active">
            <div class="card">
                <label for="scriptUrl">Script URL (Raw)</label>
                <input type="text" id="scriptUrl" placeholder="https://raw.githubusercontent.com/username/repo/main/script.lua" autocomplete="off">
                <div class="button-container">
                    <button class="btn-primary" onclick="generateLoadstring()">Generate Loadstring</button>
                </div>
            </div>
            <div class="card">
                <label>Generated Loadstring</label>
                <div class="output-box">
                    <div class="output-text" id="output">
                        <span class="placeholder">Your loadstring will appear here...</span>
                    </div>
                </div>
                <div class="button-container" style="margin-top: 20px;">
                    <button class="btn-secondary" onclick="copyToClipboard()">Copy to Clipboard</button>
                </div>
            </div>
        </div>

        <!-- Obfuscator Tab -->
        <div id="obfuscator-tab" class="tab-content">
            <div class="card">
                <label for="luaCode">Lua Script</label>
                <textarea id="luaCode" placeholder="-- Paste your Lua code here\nprint('Hello, World!')"></textarea>
                <div class="button-container">
                    <button class="btn-primary" onclick="obfuscateCode()">Obfuscate Code</button>
                </div>
            </div>
            <div class="card">
                <label>Obfuscated Code</label>
                <div class="output-box" style="min-height: 200px;">
                    <div class="output-text" id="obfuscatedOutput">
                        <span class="placeholder">Your obfuscated code will appear here...</span>
                    </div>
                </div>
                <div class="button-container" style="margin-top: 20px;">
                    <button class="btn-secondary" onclick="copyObfuscated()">Copy to Clipboard</button>
                </div>
            </div>
        </div>

        <footer>
            <p>Made By Nei | Modificado por Lynox X Gael V1</p>
        </footer>
    </div>

    <div class="notification" id="notification">✓ Copied to clipboard!</div>

    <script>
        // El JavaScript se mantiene igual (sin cambios necesarios)
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabName + '-tab').classList.add('active');
        }

        function generateLoadstring() {
            const urlInput = document.getElementById('scriptUrl');
            const url = urlInput.value.trim();
            const output = document.getElementById('output');
            if (!url) {
                output.innerHTML = '<span style="color: #ff6b6b;">⚠ Please enter a URL</span>';
                return;
            }
            const loadstring = `loadstring(game:HttpGet("${url}"))()`;
            output.innerHTML = `<span style="color: var(--accent-purple);">${loadstring}</span>`;
        }

        function obfuscateCode() {
            const codeInput = document.getElementById('luaCode');
            const code = codeInput.value.trim();
            const output = document.getElementById('obfuscatedOutput');
            if (!code) {
                output.innerHTML = '<span style="color: #ff6b6b;">⚠ Please enter Lua code</span>';
                return;
            }
            const obfuscated = simpleObfuscate(code);
            output.innerHTML = `<span style="color: var(--accent-purple); font-size: 0.75rem; word-break: break-all;">${obfuscated}</span>`;
        }

        function simpleObfuscate(code) {
            const varNames = generateRandomVars(5);
            const hex = stringToHex(code);
            let obfuscated = `(function()local ${varNames[0]}='${hex}';`;
            obfuscated += `local ${varNames[1]}=function(${varNames[2]})`;
            obfuscated += `return(${varNames[2]}:gsub('..',function(${varNames[3]})`;
            obfuscated += `return string.char(tonumber(${varNames[3]},16))end))end;`;
            obfuscated += `local ${varNames[4]}=${varNames[1]}(${varNames[0]});`;
            obfuscated += `return loadstring(${varNames[4]})()end)()`;
            return obfuscated;
        }

        function stringToHex(str) {
            let hex = '';
            for (let i = 0; i < str.length; i++) {
                const charCode = str.charCodeAt(i).toString(16);
                hex += charCode.padStart(2, '0');
            }
            return hex;
        }

        function generateRandomVars(count) {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const vars = [];
            for (let i = 0; i < count; i++) {
                let varName = '';
                const length = Math.floor(Math.random() * 3) + 5;
                for (let j = 0; j < length; j++) {
                    varName += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                vars.push(varName);
            }
            return vars;
        }

        function copyToClipboard() {
            const output = document.getElementById('output');
            const textElement = output.querySelector('span');
            if (!textElement || textElement.classList.contains('placeholder')) {
                showNotification('❌ Generate a loadstring first!', false);
                return;
            }
            const text = textElement.textContent.trim();
            copyText(text);
        }

        function copyObfuscated() {
            const output = document.getElementById('obfuscatedOutput');
            const textElement = output.querySelector('span');
            if (!textElement || textElement.classList.contains('placeholder')) {
                showNotification('❌ Obfuscate code first!', false);
                return;
            }
            const text = textElement.textContent.trim();
            copyText(text);
        }

        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showNotification('✓ Copied to clipboard!', true);
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.top = '0';
            textarea.style.left = '0';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showNotification('✓ Copied to clipboard!', true);
                } else {
                    showNotification('❌ Copy failed', false);
                }
            } catch (err) {
                showNotification('❌ Copy failed', false);
            }
            document.body.removeChild(textarea);
        }

        function showNotification(message, success) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            if (!success) {
                notification.classList.add('error');
            } else {
                notification.classList.remove('error');
            }
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        document.getElementById('scriptUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                generateLoadstring();
            }
        });
    </script>
</body>
</html>

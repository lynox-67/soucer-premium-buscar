<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Envío de Scripts - Modo Limpio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    
    body {
      font-family: 'Inter', Arial, sans-serif;
      background: linear-gradient(135deg, #1e1e2e, #2a2a40);
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #25253a;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      text-align: center;
      color: #7289da;
      margin-bottom: 30px;
    }
    label {
      display: block;
      margin: 15px 0 8px;
      font-weight: 500;
      color: #b9bbbe;
    }
    input, button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    input {
      background: #1e1e2e;
      color: #fff;
    }
    button {
      background: #5865f2;
      color: white;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
    }
    button:hover { background: #4752c4; }
    button:disabled { background: #3f3f3f; cursor: not-allowed; }

    .btn-stop {
      background: #f04747;
    }
    .btn-stop:hover { background: #d13f3f; }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #1e1e2e;
      min-height: 60px;
      font-size: 16px;
    }
    .success { color: #43b581; }
    .error { color: #f04747; }

    .progress {
      height: 6px;
      background: #5865f2;
      border-radius: 3px;
      margin-top: 10px;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📤 Envío Inteligente de Scripts</h1>
    
    <label>1. URLs de Webhooks (separadas por coma)</label>
    <input type="text" id="webhooks" placeholder="https://discord.com/api/webhooks/... , https://...">

    <label>2. Selecciona la carpeta con los scripts</label>
    <input type="file" id="folder" webkitdirectory directory multiple>

    <label>3. Delay entre envíos (ms) - Recomendado 2500+</label>
    <input type="number" id="delay" value="2500" min="1000" step="500">

    <button id="startBtn" onclick="iniciarEnvio()">🚀 Comenzar Envío</button>
    <button id="stopBtn" class="btn-stop" onclick="detenerEnvio()" disabled>⏹ Detener Envío</button>

    <div class="status" id="status">Listo para analizar y enviar...</div>
    <div class="progress" id="progress" style="width: 0%"></div>
  </div>

  <script>
    let enviando = false;
    let archivosPendientes = [];
    let enviados = new Set();
    let indexActual = 0;
    let webhooks = [];
    let delayMs = 2500;

    async function iniciarEnvio() {
      const webhooksStr = document.getElementById('webhooks').value.trim();
      delayMs = parseInt(document.getElementById('delay').value) || 2500;
      const folderInput = document.getElementById('folder');

      if (!webhooksStr) return mostrarError('Por favor ingresa al menos un webhook.');
      webhooks = webhooksStr.split(',').map(u => u.trim()).filter(u => u.startsWith('https://discord.com/api/webhooks/'));

      if (webhooks.length === 0) return mostrarError('Ningún webhook válido detectado.');
      if (folderInput.files.length === 0) return mostrarError('Selecciona una carpeta con archivos.');

      // Filtrar y analizar archivos
      let candidatos = Array.from(folderInput.files).filter(file => 
        (file.name.endsWith('.txt') || file.name.endsWith('.lua')) && 
        file.size > 0 && 
        !enviados.has(file.name)
      );

      archivosPendientes = [];
      mostrarStatus('Analizando archivos en busca de TitleLabel.Text = ...', 'normal');

      for (let file of candidatos) {
        try {
          const texto = await file.text();
          const match = texto.match(/TitleLabel\.Text\s*=\s*["']?([^"'\n\r;]+)["']?/i);
          if (match && match[1].trim()) {
            file.detectedName = match[1].trim();
            archivosPendientes.push(file);
          }
        } catch (e) {}
      }

      if (archivosPendientes.length === 0) 
        return mostrarError('No se encontraron archivos con "TitleLabel.Text ="');

      // Repartir equitativamente entre webhooks
      archivosPendientes = repartirArchivos(archivosPendientes, webhooks.length);

      enviando = true;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      mostrarStatus(`Encontrados ${archivosPendientes.length} scripts válidos.\nRepartiendo entre ${webhooks.length} webhooks...`, 'normal');

      indexActual = 0;
      await procesarEnvio();
    }

    // Función para repartir archivos de forma equitativa
    function repartirArchivos(archivos, numWebhooks) {
      const repartidos = Array.from({length: numWebhooks}, () => []);
      archivos.forEach((archivo, i) => {
        repartidos[i % numWebhooks].push(archivo);
      });
      // Aplanar manteniendo el orden por webhook
      return repartidos.flat();
    }

    async function procesarEnvio() {
      const total = archivosPendientes.length;

      while (enviando && indexActual < total) {
        const file = archivosPendientes[indexActual];
        const webhookIdx = Math.floor(indexActual / Math.ceil(total / webhooks.length)) % webhooks.length;
        const webhook = webhooks[webhookIdx];

        const titulo = file.detectedName;
        const progreso = Math.round(((indexActual + 1) / total) * 100);

        mostrarStatus(`Enviando ${indexActual + 1}/${total} → ${titulo}`, 'normal');
        document.getElementById('progress').style.width = progreso + '%';

        const formData = new FormData();
        formData.append('payload_json', JSON.stringify({ content: titulo }));
        formData.append('files[0]', file);

        try {
          const res = await fetch(webhook, { method: 'POST', body: formData });
          if (res.ok) {
            enviados.add(file.name);
            mostrarStatus(`✅ Enviado: ${titulo}`, 'success');
          } else {
            mostrarError(`Error ${res.status} en ${file.name}`);
          }
        } catch (err) {
          mostrarError(`Fallo en ${file.name}: ${err.message}`);
        }

        indexActual++;
        if (enviando && indexActual < total) {
          await new Promise(r => setTimeout(r, delayMs));
        }
      }

      if (enviando) {
        mostrarStatus(`¡Envío completado! Se enviaron ${enviados.size} archivos.`, 'success');
      } else {
        mostrarStatus('Envío detenido por el usuario.', 'normal');
      }

      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      document.getElementById('progress').style.width = '100%';
    }

    function detenerEnvio() {
      enviando = false;
      mostrarStatus('Deteniendo envío...', 'normal');
    }

    function mostrarStatus(texto, tipo = 'normal') {
      const statusEl = document.getElementById('status');
      statusEl.textContent = texto;
      statusEl.className = 'status ' + (tipo === 'success' ? 'success' : tipo === 'error' ? 'error' : '');
    }

    function mostrarError(texto) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = texto;
      statusEl.className = 'status error';
    }
  </script>
</body>
</html>

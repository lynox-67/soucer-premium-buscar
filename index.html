<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lynox X Gael V1 - Loadstring Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f0a1a;
            --bg-card: #1a1333;
            --accent-purple: #9d4edd;
            --accent-light: #c084fc;
            --accent-dark: #7c3aed;
            --text-primary: #e9d5ff;
            --text-secondary: #c4b5fd;

        /* (Todo el CSS morado que ya tenías se mantiene igual - no lo pego completo para ahorrar espacio, pero está idéntico al que te di antes) */

        /* ... resto del CSS morado ... (usa el que te di en el primer mensaje) */
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Lynox X Gael V1</h1>
            <p class="subtitle">Loadstring Generator & Lua Obfuscator (Estilo obfuscatormnx)</p>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('loadstring')">Loadstring Generator</button>
            <button class="tab" onclick="switchTab('obfuscator')">Lua Obfuscator</button>
        </div>

        <!-- Obfuscator Tab -->
        <div id="obfuscator-tab" class="tab-content active">
            <div class="card">
                <label for="luaCode">Pega tu Lua Script aquí</label>
                <textarea id="luaCode" placeholder="-- Pega tu script aquí"></textarea>
                <div class="button-container">
                    <button class="btn-primary" onclick="obfuscateCode()">Obfuscate (Estilo obfuscatormnx)</button>
                </div>
            </div>

            <div class="card">
                <label>Loader Ofuscado (cópialo y pégalo en tu executor)</label>
                <div class="output-box" style="min-height: 250px;">
                    <div class="output-text" id="obfuscatedOutput">
                        <span class="placeholder">El loader ofuscado aparecerá aquí...</span>
                    </div>
                </div>
                <div class="button-container" style="margin-top: 20px;">
                    <button class="btn-secondary" onclick="copyObfuscated()">Copy to Clipboard</button>
                </div>
            </div>
        </div>

        <footer><p>Made By Nei | Modificado por Lynox X Gael V1</p></footer>
    </div>

    <div class="notification" id="notification">✓ Copied!</div>

    <script>
        // === TODO EL JS ANTERIOR (switchTab, copy, notification, etc.) SE MANTIENE ===
        // Solo cambiamos la parte del obfuscator por el que imita exactamente obfuscatormnx

        function obfuscateCode() {
            let code = document.getElementById('luaCode').value.trim();
            const output = document.getElementById('obfuscatedOutput');
            
            if (!code) {
                output.innerHTML = '<span style="color:#ff6b6b;">⚠ Pega un código primero</span>';
                return;
            }

            // Quita comentarios (igual que obfuscatormnx)
            code = code.replace(/--[^\n]*\n?/g, '').replace(/--\[\[[\s\S]*?\]\]/g, '');

            const obfuscated = mnxObfuscate(code);
            output.innerHTML = `<span style="color:var(--accent-purple);font-size:0.78rem;word-break:break-all;white-space:pre-wrap;">${obfuscated}</span>`;
        }

        function mnxObfuscate(code) {
            const xorKey = Math.floor(Math.random() * 255) + 1;

            // Bytes + XOR + Shuffle
            let bytes = new Uint8Array(code.length);
            for (let i = 0; i < code.length; i++) bytes[i] = code.charCodeAt(i) & 0xFF;
            for (let i = 0; i < bytes.length; i++) bytes[i] ^= xorKey;
            for (let i = bytes.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [bytes[i], bytes[j]] = [bytes[j], bytes[i]];
            }

            const base64 = btoa(String.fromCharCode(...bytes));

            // Loader idéntico en estilo a obfuscatormnx
            return `-- Lynox X Gael V1 | Ofuscado como obfuscatormnx.ct.ws
local function x(b,k) return b:gsub(".",function(c) return string.char(bit32.bxor(c:byte(),k)) end) end
local d = [=[${base64}]=]
local k = ${xorKey}
local s = x(d, k)
return loadstring(s)()`;
        }

        // Mantén las funciones de copy y notification que ya tenías
        function copyObfuscated() { /* tu código de copy anterior */ }
        // ... (pega aquí tus funciones copyToClipboard, showNotification, etc.)
    </script>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BY Lynox Hub - Procesador de Carpeta</title>
    <style>
        body { font-family: Arial; background: #0d001a; color: #fff; text-align: center; padding: 40px; }
        h1 { color: #c79eff; }
        #drop-zone {
            border: 4px dashed #b388ff;
            border-radius: 15px;
            padding: 60px;
            margin: 30px auto;
            width: 70%;
            font-size: 22px;
            cursor: pointer;
        }
        #drop-zone.dragover { background: #1a0033; border-color: #ffdd99; }
        button { padding: 12px 30px; font-size: 18px; margin: 10px; border: none; border-radius: 8px; cursor: pointer; }
        #pauseBtn { background: #ffaa00; color: black; }
        table { margin: 30px auto; border-collapse: collapse; width: 60%; }
        th, td { border: 1px solid #b388ff; padding: 10px; }
        th { background: #2a004d; }
        #status { font-size: 20px; margin: 20px; }
    </style>
</head>
<body>
    <h1>BY Lynox Hub - Procesador de Carpeta</h1>
    <p>Arrastra tu carpeta aquí o haz clic para seleccionarla</p>

    <div id="drop-zone">Arrastra la carpeta aquí</div>
    <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none;">

    <button onclick="document.getElementById('folderInput').click()">Seleccionar Carpeta</button>
    <button id="pauseBtn" onclick="togglePause()">Pausar</button>

    <div id="status">Esperando carpeta...</div>

    <table id="table">
        <tr><th>Archivo</th><th>Estado</th></tr>
    </table>

    <script>
        let isPaused = false;
        const WATERMARK = `-- ╔════════════════════════════════════════════════════════════╗
-- ║                  BY Lynox Hub                              ║
-- ║            https://discord.gg/q8NEM7pPrW                   ║
-- ║       Scripts, Leaks & More → Join the Hub Now!            ║
-- ╚════════════════════════════════════════════════════════════╝

`;

        const dropZone = document.getElementById('drop-zone');
        const table = document.getElementById('table');
        const status = document.getElementById('status');
        const pauseBtn = document.getElementById('pauseBtn');

        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            processFiles(e.dataTransfer.items);
        });

        document.getElementById('folderInput').addEventListener('change', e => {
            processFiles(e.target.files);
        });

        function togglePause() {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? "Reanudar" : "Pausar";
        }

        async function processFiles(items) {
            let files = [];
            if (items[0].webkitGetAsEntry) {
                // Para arrastrar carpeta
                for (let item of items) {
                    const entry = item.webkitGetAsEntry();
                    if (entry.isDirectory) await getFilesFromDir(entry, files);
                    else files.push(item.getAsFile());
                }
            } else {
                files = Array.from(items);
            }

            if (files.length === 0) {
                status.textContent = "No se encontraron archivos";
                return;
            }

            status.textContent = `Procesando ${files.length} archivos...`;
            table.innerHTML = `<tr><th>Archivo</th><th>Estado</th></tr>`;

            let processed = 0;

            for (let file of files) {
                while (isPaused) await new Promise(r => setTimeout(r, 500));

                const row = table.insertRow();
                row.insertCell(0).textContent = file.name;
                const statusCell = row.insertCell(1);
                statusCell.textContent = "Procesando...";

                try {
                    const ext = file.name.split('.').pop().toLowerCase();
                    let newName = file.name.replace(/\.[^/.]+$/, "") + " - BY Lynox Hub." + ext;

                    if (['lua', 'luau', 'txt'].includes(ext)) {
                        const text = await file.text();
                        const lines = text.split('\n');
                        let i = 0;
                        while (i < lines.length && i < 50) {
                            if (lines[i].trim() && !lines[i].trim().startsWith('--')) break;
                            i++;
                        }
                        const clean = lines.slice(i).join('\n');
                        const finalText = WATERMARK + clean;

                        // Descargar archivo procesado
                        downloadFile(finalText, newName, 'text/plain');
                    } else {
                        downloadFile(await file.arrayBuffer(), newName, file.type || 'application/octet-stream');
                    }

                    statusCell.textContent = "✅ Listo";
                    statusCell.style.color = "#90ff90";
                } catch (err) {
                    statusCell.textContent = "❌ Error";
                    statusCell.style.color = "#ff6666";
                }

                processed++;
                status.textContent = `Procesando... ${processed}/${files.length}`;
            }

            status.innerHTML = `<b>✅ Terminó! Se procesaron ${files.length} archivos.</b>`;
        }

        function getFilesFromDir(dirEntry, fileList) {
            return new Promise(resolve => {
                dirEntry.createReader().readEntries(entries => {
                    Promise.all(entries.map(entry => {
                        if (entry.isFile) {
                            return new Promise(r => entry.file(f => { fileList.push(f); r(); }));
                        } else if (entry.isDirectory) {
                            return getFilesFromDir(entry, fileList);
                        }
                    })).then(resolve);
                });
            });
        }

        function downloadFile(content, fileName, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>

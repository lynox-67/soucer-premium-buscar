<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Enviar Solo Adjuntos (sin código en mensaje) - Fix Error 400</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #1e1e1e; color: #e0e0e0; }
    input, button { margin: 10px 0; padding: 10px; font-size: 16px; }
    button { background: #5865f2; color: white; border: none; cursor: pointer; border-radius: 5px; }
    button:disabled { background: #3f3f3f; }
    #status { color: #43b581; font-weight: bold; font-size: 16px; }
    #error { color: #f04747; font-size: 14px; }
    h2 { color: #fff; }
    label { font-size: 14px; margin-bottom: 5px; display: block; }
  </style>
</head>
<body>
  <h2>Enviar Solo Archivos Adjuntos (Fix para Error 400 en TODOS)</h2>
  <p>Esto envía SOLO el archivo con su nombre original. Mensaje corto para evitar 400.</p>
  
  <label>1. URLs de Webhooks (separadas por coma):</label>
  <input type="text" id="webhooks" size="100" placeholder="https://discord.com/api/webhooks/..."><br>
  
  <label>2. Selecciona la carpeta:</label>
  <input type="file" id="folder" webkitdirectory directory multiple><br>
  
  <label>3. Delay (ms) – pon 3000 o más si falla:</label>
  <input type="number" id="delay" value="3000" min="1000" step="500"><br>
  
  <button id="startBtn" onclick="iniciarEnvio()">Comenzar</button>
  <button id="stopBtn" onclick="detenerEnvio()" disabled>Detener</button>
  
  <p id="status">Esperando...</p>
  <p id="error"></p>

  <script>
    let enviando = false;
    let archivosPendientes = [];
    let enviados = new Set();
    let indexActual = 0;
    let webhooks = [];
    let delayMs = 3000;

    const extensionesPermitidas = new Set(['.txt', '.lua']);

    async function iniciarEnvio() {
      const webhooksStr = document.getElementById('webhooks').value.trim();
      delayMs = parseInt(document.getElementById('delay').value) || 3000;
      const folderInput = document.getElementById('folder');

      if (!webhooksStr) return mostrarError('Pon webhooks válidos.');
      webhooks = webhooksStr.split(',').map(u => u.trim()).filter(u => u.startsWith('https://discord.com/api/webhooks/'));

      if (webhooks.length === 0) return mostrarError('Webhooks no válidos.');
      if (folderInput.files.length === 0) return mostrarError('Selecciona carpeta.');

      let candidatos = Array.from(folderInput.files).filter(file => {
        const ext = (file.name || '').toLowerCase().slice(file.name.lastIndexOf('.'));
        return extensionesPermitidas.has(ext) && !enviados.has(file.name) && file.size > 0;
      });

      archivosPendientes = [];
      mostrarStatus('Analizando... Buscando TitleLabel.Text = ...');

      for (let file of candidatos) {
        try {
          const texto = await file.text();
          const match = texto.match(/TitleLabel\.Text\s*=\s*["']?([^"'\n\r;]+)["']?/i);
          if (match && match[1].trim()) {
            file.detectedName = match[1].trim();
            archivosPendientes.push(file);
          }
        } catch {}
      }

      if (archivosPendientes.length === 0) return mostrarError('Ningún archivo con TitleLabel.Text = ...');

      enviando = true;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      mostrarStatus(`Listo: ${archivosPendientes.length} válidos. Enviando...`);

      indexActual = 0;
      await procesarEnvio();
    }

    async function procesarEnvio() {
      while (enviando && indexActual < archivosPendientes.length) {
        const file = archivosPendientes[indexActual];
        const webhookIdx = indexActual % webhooks.length;
        const webhook = webhooks[webhookIdx];

        const nombre = file.detectedName || 'Sin título';
        mostrarStatus(`[${indexActual+1}/${archivosPendientes.length}] ${file.name} (${nombre})`);

        const formData = new FormData();
        formData.append('payload_json', JSON.stringify({
          content: `Script válido: **${file.name}**\nTítulo detectado: ${nombre}\nTamaño: ${Math.round(file.size / 1024)} KB`
        }));
        formData.append('files[0]', file);  // Cambiado a 'files[0]' para compatibilidad estricta

        try {
          const res = await fetch(webhook, { method: 'POST', body: formData });
          if (res.ok) {
            enviados.add(file.name);
            mostrarStatus(`OK: ${file.name} enviado`);
          } else {
            const errText = await res.text();
            mostrarError(`Error ${res.status} en ${file.name}: ${errText || 'Bad Request'}`);
          }
        } catch (err) {
          mostrarError(`Fallo ${file.name}: ${err.message}`);
        }

        indexActual++;
        if (enviando && indexActual < archivosPendientes.length) {
          await new Promise(r => setTimeout(r, delayMs));
        }
      }

      if (enviando) mostrarStatus('¡Terminado!');
      else mostrarStatus('Detenido.');
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    }

    function detenerEnvio() {
      enviando = false;
      mostrarStatus('Deteniendo...');
    }

    function mostrarStatus(msg) { document.getElementById('status').textContent = msg; document.getElementById('error').textContent = ''; }
    function mostrarError(msg) { document.getElementById('error').textContent = msg; }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🌐 Mi Dumper Luarmor + GitHub (Personal)</title>
  <style>
    body { font-family: monospace; background: #0d0d0d; color: #0f0; padding: 20px; margin: 0; }
    h1 { color: #00ff00; text-align: center; }
    input, button, textarea { width: 100%; padding: 12px; margin: 10px 0; font-family: monospace; font-size: 16px; }
    button { background: #00ff00; color: black; font-weight: bold; cursor: pointer; border: none; padding: 15px; }
    button:hover { background: #00cc00; }
    .info { color: #ffff00; font-size: 14px; }
  </style>
</head>
<body>
  <h1>🌐 Mi Dumper Personal - Luarmor & GitHub</h1>
  <p class="info">Pega cualquier link de Luarmor o GitHub (blob o raw)</p>
  
  <input type="text" id="url" placeholder="Ej: https://api.luarmor.net/files/v4/loaders/809d5c7dc0793246c9ff00a2808c238c.lua" value="">
  
  <button onclick="dumpFile()">🚀 Dumpear + Descargar Archivo</button>
  
  <textarea id="result" rows="25" readonly placeholder="El contenido dumpeado aparecerá aquí..."></textarea>
  
  <button onclick="downloadDumped()">📥 Descargar Archivo Dumpeado (.lua)</button>

  <script>
    let dumpedContent = "";

    async function dumpFile() {
      let url = document.getElementById('url').value.trim();
      const result = document.getElementById('result');
      result.value = "Cargando y dumpeando...";

      // === AUTO-CONVERSIÓN GITHUB ===
      if (url.includes('github.com') && url.includes('/blob/')) {
        url = url.replace('github.com', 'raw.githubusercontent.com')
                 .replace('/blob/', '/');
      }

      try {
        // Proxy para Luarmor y GitHub
        const proxy = `https://corsproxy.io/?${encodeURIComponent(url)}`;
        const res = await fetch(proxy);
        
        if (!res.ok) throw new Error("No se pudo acceder (Luarmor requiere ejecución o key)");

        let text = await res.text();

        // === LIMPIEZA BÁSICA (Dump) ===
        text = text.replace(/--\s*ts file was generated at.*?\n/g, '');
        text = text.replace(/makefolder\('static_content_.*?'\)/g, '-- makefolder removido');

        dumpedContent = text;  // Guardamos para descargar
        result.value = text;

      } catch (e) {
        result.value = "❌ Error: " + e.message + "\n\nPrueba ejecutar el script en Roblox y dumpear manualmente si es Luarmor pro.";
      }
    }

    function downloadDumped() {
      if (!dumpedContent) {
        alert("Primero dumpea el link");
        return;
      }
      const blob = new Blob([dumpedContent], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = "script_dumpeado.lua";
      a.click();
    }
  </script>
</body>
</html>

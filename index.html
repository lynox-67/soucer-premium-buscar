<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BY Lynox Hub - Procesador</title>
    <style>
        body { font-family: Arial; background: #0d001a; color: #fff; text-align: center; padding: 40px; }
        h1 { color: #c79eff; }
        #drop-zone {
            border: 4px dashed #b388ff;
            border-radius: 15px;
            padding: 70px;
            margin: 30px auto;
            width: 70%;
            font-size: 24px;
            cursor: pointer;
        }
        #drop-zone.dragover { background: #2a004d; border-color: #ffdd99; }
        button { padding: 14px 35px; font-size: 18px; margin: 10px; border: none; border-radius: 10px; cursor: pointer; }
        #pauseBtn { background: #ffaa00; color: black; }
        table { margin: 30px auto; border-collapse: collapse; width: 80%; max-width: 900px; }
        th, td { border: 1px solid #b388ff; padding: 10px; text-align: left; }
        th { background: #2a004d; }
        #status { font-size: 20px; margin: 20px; min-height: 30px; }
    </style>
</head>
<body>
    <h1>BY Lynox Hub - Procesador de Carpeta</h1>
    <p>Arrastra tu carpeta aquí</p>

    <div id="drop-zone">Arrastra la carpeta completa aquí</div>
    <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none;">

    <button onclick="document.getElementById('folderInput').click()">Seleccionar Carpeta</button>
    <button id="pauseBtn" onclick="togglePause()">Pausar</button>

    <div id="status">Esperando carpeta...</div>

    <table id="table">
        <tr><th>Archivo</th><th>Estado</th></tr>
    </table>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        let isPaused = false;
        const WATERMARK = `-- ╔════════════════════════════════════════════════════════════╗
-- ║                  BY Lynox Hub                              ║
-- ║            https://discord.gg/q8NEM7pPrW                   ║
-- ║       Scripts, Leaks & More → Join the Hub Now!            ║
-- ╚════════════════════════════════════════════════════════════╝

`;

        const dropZone = document.getElementById('drop-zone');
        const table = document.getElementById('table');
        const status = document.getElementById('status');
        const pauseBtn = document.getElementById('pauseBtn');

        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            processFolder(e.dataTransfer.items);
        });

        document.getElementById('folderInput').addEventListener('change', e => {
            processFolder(e.target.files);
        });

        function togglePause() {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? "Reanudar" : "Pausar";
        }

        async function processFolder(items) {
            let files = [];
            const newZip = new JSZip();

            // Obtener todos los archivos de la carpeta
            if (items[0] && items[0].webkitGetAsEntry) {
                for (let item of items) {
                    const entry = item.webkitGetAsEntry();
                    if (entry) await getAllFiles(entry, files, "");
                }
            } else {
                files = Array.from(items);
            }

            if (files.length === 0) {
                status.textContent = "❌ No se encontraron archivos";
                return;
            }

            status.textContent = `Procesando ${files.length} archivos...`;
            table.innerHTML = `<tr><th>Archivo</th><th>Estado</th></tr>`;

            let processed = 0;

            for (let file of files) {
                while (isPaused) await new Promise(r => setTimeout(r, 300));

                const row = table.insertRow();
                row.insertCell(0).textContent = file.name;
                const statusCell = row.insertCell(1);
                statusCell.textContent = "Procesando...";

                const ext = file.name.split('.').pop().toLowerCase();
                let newName = file.name.replace(/\.[^/.]+$/, "") + " - BY Lynox Hub." + ext;

                try {
                    if (['lua', 'luau', 'txt'].includes(ext)) {
                        let text = await file.text();
                        // Limpiar comentarios iniciales
                        let lines = text.split('\n');
                        let i = 0;
                        while (i < lines.length && i < 50) {
                            if (lines[i].trim() && !lines[i].trim().startsWith('--')) break;
                            i++;
                        }
                        text = lines.slice(i).join('\n');
                        text = WATERMARK + text;
                        newZip.file(newName, text);
                    } else {
                        const buffer = await file.arrayBuffer();
                        newZip.file(newName, buffer);
                    }

                    statusCell.textContent = "✅ Listo";
                    statusCell.style.color = "#90ff90";
                } catch (e) {
                    statusCell.textContent = "❌ Error";
                    statusCell.style.color = "#ff6666";
                }

                processed++;
                status.textContent = `Procesando... ${processed} / ${files.length}`;
            }

            // Generar y descargar ZIP final
            status.textContent = "Creando ZIP final...";
            const blob = await newZip.generateAsync({type: "blob"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "Procesado_BY_Lynox_Hub.zip";
            a.click();

            status.innerHTML = `<b>✅ ¡Terminado! Se procesaron ${files.length} archivos.<br>Descargando ZIP...</b>`;
        }

        async function getAllFiles(dirEntry, fileList, path) {
            return new Promise(resolve => {
                dirEntry.createReader().readEntries(async entries => {
                    for (let entry of entries) {
                        if (entry.isFile) {
                            const file = await new Promise(r => entry.file(r));
                            fileList.push(file);
                        } else if (entry.isDirectory) {
                            await getAllFiles(entry, fileList, path + entry.name + "/");
                        }
                    }
                    resolve();
                });
            });
        }
    </script>
</body>
</html>

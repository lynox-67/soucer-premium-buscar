<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BY Lynox Hub - Scripts & Leaks</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0a001f, #1a0033, #2a004d);
      color: #e0ccff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    .header {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      padding: 25px 0;
      text-align: center;
      border-bottom: 2px solid #b388ff;
    }

    .header h1 {
      margin: 0;
      font-size: 3rem;
      background: linear-gradient(90deg, #c79eff, #ff99cc, #ffdd99);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .discord-btn {
      margin-top: 15px;
      padding: 12px 30px;
      background: #5865F2;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .discord-btn:hover {
      background: #4752c4;
      transform: scale(1.05);
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .search {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 1.1rem;
      margin-bottom: 30px;
    }

    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 18px;
    }

    .file-card {
      background: rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 20px;
      transition: 0.3s;
      border: 1px solid rgba(179, 136, 255, 0.3);
    }

    .file-card:hover {
      transform: translateY(-8px);
      background: rgba(255,255,255,0.12);
      box-shadow: 0 10px 30px rgba(179, 136, 255, 0.2);
    }

    .file-name {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: #ffdd99;
    }

    .download-btn {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #b388ff, #ff99cc);
      color: black;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .total {
      text-align: center;
      margin: 30px 0;
      font-size: 1.3rem;
      opacity: 0.9;
    }

    .watermark {
      text-align: center;
      margin-top: 60px;
      opacity: 0.6;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>BY LYNox HUB</h1>
    <p>Scripts • Leaks • Tools</p>
    <button class="discord-btn" onclick="window.open('https://discord.gg/q8NEM7pPrW', '_blank')">
      Unirse al Discord
    </button>
  </div>

  <div class="container">
    <input type="text" id="search" class="search" placeholder="Buscar script..." onkeyup="filtrar()">

    <div class="total" id="total">Cargando archivos...</div>

    <div class="file-grid" id="fileGrid"></div>
  </div>

  <div class="watermark">
    Powered by BY Lynox Hub • discord.gg/q8NEM7pPrW
  </div>

  <script>
    // Aquí se cargarán automáticamente los archivos de tu carpeta
    const files = []; // Se llenará con Python o manualmente

    // Función para mostrar archivos (se puede mejorar después)
    function mostrarArchivos(lista) {
      const grid = document.getElementById('fileGrid');
      grid.innerHTML = '';
      
      lista.forEach(file => {
        const card = document.createElement('div');
        card.className = 'file-card';
        card.innerHTML = `
          <div class="file-name">${file}</div>
          <button class="download-btn" onclick="descargar('${file}')">
            Descargar Archivo
          </button>
        `;
        grid.appendChild(card);
      });
      
      document.getElementById('total').textContent = `${lista.length} archivos disponibles`;
    }

    function filtrar() {
      const term = document.getElementById('search').value.toLowerCase();
      const filtered = files.filter(f => f.toLowerCase().includes(term));
      mostrarArchivos(filtered);
    }

    function descargar(nombre) {
      window.location.href = nombre; // Descarga directa
    }

    // Carga automática de archivos (puedes mejorarlo después con Python)
    window.onload = () => {
      // Por ahora muestra un mensaje
      document.getElementById('total').innerHTML = `
        <strong>Web lista.</strong><br>
        Para que aparezcan los archivos, guarda esta página como <code>index.html</code> 
        dentro de la carpeta <strong>SOUCERLYNOX</strong>
      `;
    };
  </script>
</body>
</html>

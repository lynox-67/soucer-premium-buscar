<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Enviar Solo Scripts con TitleLabel.Text + Nombre Detectado</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #1e1e1e; color: #e0e0e0; }
    input, button { margin: 10px 0; padding: 10px; font-size: 16px; }
    button { background: #5865f2; color: white; border: none; cursor: pointer; border-radius: 5px; }
    button:disabled { background: #3f3f3f; }
    #status { color: #43b581; font-weight: bold; font-size: 16px; }
    #error { color: #f04747; font-size: 14px; }
    h2 { color: #fff; }
    label { font-size: 14px; margin-bottom: 5px; display: block; }
  </style>
</head>
<body>
  <h2>Enviar Solo Scripts que tengan "TitleLabel.Text =" (con nombre detectado)</h2>
  
  <label>1. URLs de Webhooks (separadas por coma):</label>
  <input type="text" id="webhooks" size="100" placeholder="https://discord.com/api/webhooks/... , https://..."><br>
  
  <label>2. Selecciona la carpeta con los scripts:</label>
  <input type="file" id="folder" webkitdirectory directory multiple><br>
  
  <label>3. Delay entre envíos (ms) – 1500–3000 recomendado:</label>
  <input type="number" id="delay" value="2000" min="500" step="100"><br>
  
  <button id="startBtn" onclick="iniciarEnvio()">Comenzar Envío</button>
  <button id="stopBtn" onclick="detenerEnvio()" disabled>Detener Envío</button>
  
  <p id="status">Esperando...</p>
  <p id="error"></p>

  <script>
    let enviando = false;
    let archivosPendientes = [];
    let enviados = new Set();
    let indexActual = 0;
    let webhooks = [];
    let delayMs = 2000;

    const extensionesPermitidas = new Set(['.txt', '.lua']);

    async function iniciarEnvio() {
      const webhooksStr = document.getElementById('webhooks').value.trim();
      delayMs = parseInt(document.getElementById('delay').value) || 2000;
      const folderInput = document.getElementById('folder');

      if (!webhooksStr) return mostrarError('Ingresa webhooks válidos.');
      webhooks = webhooksStr.split(',').map(u => u.trim()).filter(u => u.startsWith('https://discord.com/api/webhooks/'));

      if (webhooks.length === 0) return mostrarError('Ningún webhook válido.');
      if (folderInput.files.length === 0) return mostrarError('Selecciona carpeta.');

      // Filtrar preliminar por extensión
      let candidatos = Array.from(folderInput.files).filter(file => {
        const ext = (file.name || '').toLowerCase().slice(file.name.lastIndexOf('.'));
        return extensionesPermitidas.has(ext) && !enviados.has(file.name);
      });

      archivosPendientes = [];
      mostrarStatus('Analizando archivos... (buscando TitleLabel.Text = ...)');

      // Analizar cada uno para ver si tiene el patrón
      for (let file of candidatos) {
        try {
          const contenido = await file.text();
          const match = contenido.match(/TitleLabel\.Text\s*=\s*["']?([^"'\n\r;]+)["']?/i);
          if (match && match[1].trim()) {
            file.detectedName = match[1].trim(); // Guardamos el nombre detectado
            archivosPendientes.push(file);
          }
        } catch (e) {
          // Si no se puede leer, lo saltamos silenciosamente
        }
      }

      if (archivosPendientes.length === 0) {
        return mostrarError('No se encontraron archivos con "TitleLabel.Text = ..."');
      }

      enviando = true;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      mostrarStatus(`Encontrados ${archivosPendientes.length} scripts válidos. Iniciando...`);

      indexActual = 0;
      await procesarEnvio();
    }

    async function procesarEnvio() {
      while (enviando && indexActual < archivosPendientes.length) {
        const file = archivosPendientes[indexActual];
        const webhookIdx = indexActual % webhooks.length;
        const webhook = webhooks[webhookIdx];

        const nombreDetectado = file.detectedName || 'No detectado';
        mostrarStatus(`[${indexActual+1}/${archivosPendientes.length}] Enviando ${file.name} (Título: ${nombreDetectado})`);

        let contenido = '';
        try {
          contenido = await file.text();
        } catch (e) {
          mostrarError(`No se pudo leer ${file.name}`);
          indexActual++;
          continue;
        }

        const formData = new FormData();
        formData.append('payload_json', JSON.stringify({
          content: `**Archivo original:** ${file.name}\n**Título detectado:** ${nombreDetectado}\n\`\`\`lua\n${contenido}\n\`\`\``
        }));
        formData.append('files[]', file); // Llega con nombre original

        try {
          const res = await fetch(webhook, { method: 'POST', body: formData });
          if (res.ok) {
            enviados.add(file.name);
            mostrarStatus(`Éxito: ${file.name} enviado (Título: ${nombreDetectado})`);
          } else {
            mostrarError(`Error ${res.status} en ${file.name}`);
          }
        } catch (err) {
          mostrarError(`Fallo en ${file.name}: ${err.message}`);
        }

        indexActual++;
        if (enviando && indexActual < archivosPendientes.length) {
          await new Promise(r => setTimeout(r, delayMs));
        }
      }

      if (enviando) {
        mostrarStatus(`¡Terminado! Enviados ${enviados.size} archivos válidos.`);
      } else {
        mostrarStatus('Envío detenido.');
      }
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    }

    function detenerEnvio() {
      enviando = false;
      mostrarStatus('Deteniendo...');
    }

    function mostrarStatus(msg) {
      document.getElementById('status').textContent = msg;
      document.getElementById('error').textContent = '';
    }

    function mostrarError(msg) {
      document.getElementById('error').textContent = msg;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Envío de Scripts - Reparto Equitativo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1e1e2e;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 850px;
      margin: 0 auto;
      background: #25253a;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }
    h1 { text-align: center; color: #7289da; margin-bottom: 25px; }
    label { display: block; margin: 15px 0 6px; font-weight: 500; color: #b9bbbe; }
    input, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    input { background: #1e1e2e; color: white; }
    button {
      background: #5865f2;
      color: white;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }
    button:hover { background: #4752c4; }
    button:disabled { background: #404040; cursor: not-allowed; }
    .btn-stop { background: #f04747; }
    .btn-stop:hover { background: #d13f3f; }

    .status {
      margin-top: 20px;
      padding: 15px;
      background: #1e1e2e;
      border-radius: 8px;
      min-height: 50px;
      font-size: 15.5px;
      line-height: 1.5;
    }
    .success { color: #43b581; }
    .error { color: #f04747; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📤 Envío de Scripts con Reparto Equitativo</h1>
    
    <label>1. Pega las URLs de los Webhooks (una por línea o separadas por coma)</label>
    <textarea id="webhooks" rows="6" placeholder="https://discord.com/api/webhooks/...\nhttps://discord.com/api/webhooks/..."></textarea>

    <label>2. Selecciona la carpeta con los scripts</label>
    <input type="file" id="folder" webkitdirectory directory multiple>

    <label>3. Delay entre envíos (ms) - Recomendado 2500 - 4000</label>
    <input type="number" id="delay" value="3000" min="1000" step="500">

    <button id="startBtn" onclick="iniciarEnvio()">🚀 Comenzar Envío</button>
    <button id="stopBtn" class="btn-stop" onclick="detenerEnvio()" disabled>⏹ Detener Envío</button>

    <div class="status" id="status">Listo para analizar los archivos...</div>
  </div>

  <script>
    let enviando = false;
    let archivosPendientes = [];
    let enviados = new Set();
    let indexActual = 0;
    let webhooks = [];
    let delayMs = 3000;

    async function iniciarEnvio() {
      const webhooksText = document.getElementById('webhooks').value.trim();
      delayMs = parseInt(document.getElementById('delay').value) || 3000;
      const folderInput = document.getElementById('folder');

      if (!webhooksText) return mostrarError('Ingresa al menos un webhook.');

      // Soporta una URL por línea o separadas por coma
      webhooks = webhooksText.split(/[\n,]/)
                           .map(u => u.trim())
                           .filter(u => u.startsWith('https://discord.com/api/webhooks/'));

      if (webhooks.length === 0) return mostrarError('No se detectaron webhooks válidos.');

      if (folderInput.files.length === 0) return mostrarError('Selecciona una carpeta.');

      // Filtrar candidatos
      let candidatos = Array.from(folderInput.files).filter(file => 
        (file.name.endsWith('.txt') || file.name.endsWith('.lua')) && 
        file.size > 0 && 
        !enviados.has(file.name)
      );

      archivosPendientes = [];
      mostrarStatus(`Analizando ${candidatos.length} archivos...`);

      // Detectar TitleLabel.Text =
      for (let file of candidatos) {
        try {
          const texto = await file.text();
          const match = texto.match(/TitleLabel\.Text\s*=\s*["']?([^"'\n\r;]+)["']?/i);
          if (match && match[1].trim()) {
            file.detectedName = match[1].trim();
            archivosPendientes.push(file);
          }
        } catch (e) {}
      }

      if (archivosPendientes.length === 0) 
        return mostrarError('No se encontraron archivos con TitleLabel.Text = ...');

      // Repartir equitativamente entre los webhooks
      archivosPendientes = repartirEquitativamente(archivosPendientes, webhooks.length);

      enviando = true;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;

      mostrarStatus(`✅ Encontrados ${archivosPendientes.length} scripts válidos.\nRepartiendo entre ${webhooks.length} webhooks...`);

      indexActual = 0;
      await procesarEnvio();
    }

    // Función para repartir los archivos de forma justa
    function repartirEquitativamente(archivos, numWebhooks) {
      const grupos = Array.from({length: numWebhooks}, () => []);
      archivos.forEach((archivo, i) => {
        grupos[i % numWebhooks].push(archivo);
      });
      return grupos.flat(); // Aplana manteniendo el orden
    }

    async function procesarEnvio() {
      const total = archivosPendientes.length;

      while (enviando && indexActual < total) {
        const file = archivosPendientes[indexActual];
        const webhookIndex = Math.floor(indexActual / Math.ceil(total / webhooks.length)) % webhooks.length;
        const webhook = webhooks[webhookIndex];

        const titulo = file.detectedName;

        mostrarStatus(`Enviando ${indexActual + 1}/${total} → ${titulo}`);

        const formData = new FormData();
        formData.append('payload_json', JSON.stringify({ content: titulo }));
        formData.append('files[0]', file);

        try {
          const res = await fetch(webhook, { method: 'POST', body: formData });
          if (res.ok) {
            enviados.add(file.name);
            mostrarStatus(`✅ Enviado correctamente: ${titulo}`, 'success');
          } else {
            mostrarError(`Error ${res.status} → ${file.name}`);
          }
        } catch (err) {
          mostrarError(`Fallo de conexión en ${file.name}`);
        }

        indexActual++;
        if (enviando && indexActual < total) {
          await new Promise(r => setTimeout(r, delayMs));
        }
      }

      if (enviando) mostrarStatus(`¡Finalizado! Se enviaron ${enviados.size} archivos.`, 'success');
      else mostrarStatus('Envío detenido.', 'success');

      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    }

    function detenerEnvio() {
      enviando = false;
      mostrarStatus('Deteniendo envío...');
    }

    function mostrarStatus(texto, tipo = '') {
      const el = document.getElementById('status');
      el.textContent = texto;
      el.className = 'status ' + (tipo === 'success' ? 'success' : tipo === 'error' ? 'error' : '');
    }

    function mostrarError(texto) {
      const el = document.getElementById('status');
      el.textContent = texto;
      el.className = 'status error';
    }
  </script>
</body>
</html>

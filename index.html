<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BY Lynox Hub - Scripts & Leaks</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0a001f, #1a0033, #2a004d);
      color: #e0ccff;
      font-family: 'Inter', sans-serif;
    }

    .header {
      background: rgba(0,0,0,0.8);
      text-align: center;
      padding: 40px 20px;
      border-bottom: 3px solid #b388ff;
    }

    .header h1 {
      font-size: 3.5rem;
      margin: 0;
      background: linear-gradient(90deg, #c79eff, #ff99cc, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 1.4rem;
      opacity: 0.9;
      margin: 10px 0 20px;
    }

    .discord-btn {
      padding: 14px 40px;
      background: #5865F2;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .container {
      max-width: 1300px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .search {
      width: 100%;
      padding: 18px;
      border-radius: 15px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 20px;
    }

    .file-card {
      background: rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 22px;
      transition: all 0.3s;
      border: 1px solid rgba(179, 136, 255, 0.3);
    }

    .file-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 35px rgba(179, 136, 255, 0.25);
    }

    .file-name {
      font-size: 1.25rem;
      font-weight: 600;
      color: #ffdd99;
      margin-bottom: 8px;
    }

    .description {
      font-size: 0.95rem;
      opacity: 0.85;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .download-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #b388ff, #ff99cc);
      color: black;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .total {
      text-align: center;
      font-size: 1.4rem;
      margin: 30px 0;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>BY LYNox HUB</h1>
    <p class="subtitle">Scripts • Leaks • Tools Premium</p>
    <button class="discord-btn" onclick="window.open('https://discord.gg/q8NEM7pPrW', '_blank')">
      Unirse al Discord Oficial
    </button>
  </div>

  <div class="container">
    <input type="text" id="search" class="search" placeholder="🔍 Buscar script..." onkeyup="buscar()">

    <div class="total" id="contador">Cargando archivos...</div>

    <div class="file-grid" id="grid"></div>
  </div>

  <script>
    // ==================== LISTA DE ARCHIVOS (se llenará automáticamente) ====================
    const archivos = [];

    function cargarArchivos() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      archivos.forEach(archivo => {
        const card = document.createElement('div');
        card.className = 'file-card';
        card.innerHTML = `
          <div class="file-name">${archivo}</div>
          <div class="description">
            Script optimizado • Incluye marca de agua BY Lynox Hub<br>
            Listo para usar • Leak / Tool
          </div>
          <button class="download-btn" onclick="descargar('${archivo}')">
            ⬇️ Descargar Archivo
          </button>
        `;
        grid.appendChild(card);
      });

      document.getElementById('contador').textContent = `${archivos.length} scripts disponibles`;
    }

    function descargar(nombre) {
      window.location.href = nombre;
    }

    function buscar() {
      const termino = document.getElementById('search').value.toLowerCase();
      const filtrados = archivos.filter(arch => arch.toLowerCase().includes(termino));
      
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      filtrados.forEach(archivo => {
        const card = document.createElement('div');
        card.className = 'file-card';
        card.innerHTML = `
          <div class="file-name">${archivo}</div>
          <div class="description">
            Script optimizado • Incluye marca de agua BY Lynox Hub
          </div>
          <button class="download-btn" onclick="descargar('${archivo}')">
            ⬇️ Descargar Archivo
          </button>
        `;
        grid.appendChild(card);
      });
    }

    // Cargar archivos automáticamente cuando se abra la página
    window.onload = () => {
      // Aquí puedes poner manualmente los nombres si quieres, o usar Python para generarlos
      console.log("Web de BY Lynox Hub cargada correctamente");
      // Por ahora mostramos mensaje
      document.getElementById('contador').innerHTML = `
        <strong>Web lista.</strong><br>
        Guarda esta página como <code>index.html</code> dentro de la carpeta SOUCERLYNOX
      `;
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BY Lynox Hub - Scripts Analizados</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    body {
      margin: 0; padding: 0;
      background: linear-gradient(135deg, #0a001f, #1a0033, #2a004d);
      color: #e0ccff;
      font-family: 'Inter', sans-serif;
    }

    .header {
      background: rgba(0,0,0,0.9);
      text-align: center;
      padding: 50px 20px;
      border-bottom: 4px solid #b388ff;
    }

    .header h1 {
      font-size: 3.8rem;
      margin: 0;
      background: linear-gradient(90deg, #c79eff, #ff99cc, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .container {
      max-width: 1450px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .search {
      width: 100%;
      padding: 18px 25px;
      border-radius: 15px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 1.25rem;
      margin-bottom: 35px;
    }

    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(460px, 1fr));
      gap: 25px;
    }

    .file-card {
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 25px;
      transition: 0.4s;
      border: 1px solid rgba(179, 136, 255, 0.4);
    }

    .file-card:hover {
      transform: translateY(-12px);
      box-shadow: 0 20px 45px rgba(179, 136, 255, 0.35);
    }

    .sticker {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .file-name {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffdd99;
      margin: 10px 0 12px;
    }

    .description {
      font-size: 1.05rem;
      line-height: 1.65;
      opacity: 0.92;
      min-height: 95px;
    }

    .download-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(90deg, #b388ff, #ff99cc);
      color: black;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      font-size: 1.2rem;
      cursor: pointer;
      margin-top: 15px;
    }

    .total {
      text-align: center;
      font-size: 1.5rem;
      margin: 30px 0;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>BY LYNox HUB</h1>
    <p>Scripts Analizados • Leaks Premium</p>
  </div>

  <div class="container">
    <input type="text" id="search" class="search" placeholder="🔍 Buscar por nombre o función..." onkeyup="buscar()">

    <div class="total" id="contador">Cargando scripts...</div>

    <div class="file-grid" id="grid"></div>
  </div>

  <script>
    let todosLosArchivos = [];

    function getStickerYDescripcion(nombre) {
      const n = nombre.toLowerCase();
      
      if (n.includes("steal") || n.includes("robux") || n.includes("stealer")) 
        return {emoji: "💰", desc: "Script Stealer / Robux Generator. Roba información o genera recursos."};
      
      if (n.includes("esp") || n.includes("aimbot") || n.includes("wallhack")) 
        return {emoji: "🎯", desc: "ESP + Aimbot. Muestra jugadores y ayuda a apuntar automáticamente."};
      
      if (n.includes("fly") || n.includes("speed") || n.includes("noclip")) 
        return {emoji: "✈️", desc: "Fly / Speed Hack. Permite volar o moverte más rápido."};
      
      if (n.includes("farm") || n.includes("auto") || n.includes("grinder")) 
        return {emoji: "🌾", desc: "Auto Farm. Recolecta recursos automáticamente."};
      
      if (n.includes("gui") || n.includes("menu") || n.includes("hub")) 
        return {emoji: "📋", desc: "Menú Gráfico. Interfaz limpia y fácil de usar."};
      
      if (n.includes("bypass") || n.includes("anticheat")) 
        return {emoji: "🔓", desc: "Bypass Anticheat. Evita detección del servidor."};
      
      if (n.includes("executor") || n.includes("injector")) 
        return {emoji: "⚡", desc: "Executor / Tool para ejecutar scripts."};
      
      return {emoji: "📜", desc: "Script multifunción optimizado y limpio."};
    }

    function cargarArchivos() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      todosLosArchivos.forEach(nombre => {
        const info = getStickerYDescripcion(nombre);
        
        const card = document.createElement('div');
        card.className = 'file-card';
        card.innerHTML = `
          <div class="sticker">${info.emoji}</div>
          <div class="file-name">${nombre}</div>
          <div class="description">${info.desc}</div>
          <button class="download-btn" onclick="descargar('${nombre}')">
            ⬇️ Descargar Script
          </button>
        `;
        grid.appendChild(card);
      });

      document.getElementById('contador').textContent = `${todosLosArchivos.length} scripts analizados`;
    }

    function descargar(nombre) {
      window.location.href = nombre;
    }

    function buscar() {
      const term = document.getElementById('search').value.toLowerCase();
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      const filtrados = todosLosArchivos.filter(arch => 
        arch.toLowerCase().includes(term)
      );

      filtrados.forEach(nombre => {
        const info = getStickerYDescripcion(nombre);
        const card = document.createElement('div');
        card.className = 'file-card';
        card.innerHTML = `
          <div class="sticker">${info.emoji}</div>
          <div class="file-name">${nombre}</div>
          <div class="description">${info.desc}</div>
          <button class="download-btn" onclick="descargar('${nombre}')">
            ⬇️ Descargar Script
          </button>
        `;
        grid.appendChild(card);
      });
    }

    // ==================== CARGA AUTOMÁTICA ====================
    window.onload = () => {
      // Por ahora mostramos un mensaje. 
      // La parte automática la haremos con Python en el siguiente paso.
      document.getElementById('contador').innerHTML = `
        Web lista.<br>
        Para que aparezcan tus archivos automáticamente, dime "quiero la versión Python" 
        y te doy el generador.
      `;
    };
  </script>
</body>
</html>

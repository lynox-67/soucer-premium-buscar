<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BY Lynox Hub - Procesador</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0d001a;
            color: #fff;
            text-align: center;
            padding: 50px;
        }
        h1 { color: #c79eff; }
        #drop-zone {
            border: 4px dashed #b388ff;
            border-radius: 15px;
            padding: 60px;
            margin: 30px auto;
            width: 70%;
            font-size: 20px;
            cursor: pointer;
        }
        #drop-zone.dragover {
            background: #1a0033;
            border-color: #ffdd99;
        }
        button {
            padding: 15px 40px;
            font-size: 18px;
            background: #b388ff;
            color: black;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        button:hover { background: #ffdd99; }
        #status { margin-top: 20px; font-size: 18px; }
    </style>
</head>
<body>
    <h1>BY Lynox Hub - Procesador Simple</h1>
    <p>Arrastra tu carpeta (como ZIP) o haz clic para seleccionarla</p>

    <div id="drop-zone">
        Arrastra el ZIP aquí<br>o<br><strong>Haz clic para subir</strong>
    </div>

    <input type="file" id="fileInput" accept=".zip" style="display:none;">
    <button onclick="document.getElementById('fileInput').click()">Seleccionar ZIP</button>

    <div id="status"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');

        const WATERMARK = `-- ╔════════════════════════════════════════════════════════════╗
-- ║                  BY Lynox Hub                              ║
-- ║            https://discord.gg/q8NEM7pPrW                   ║
-- ║       Scripts, Leaks & More → Join the Hub Now!            ║
-- ╚════════════════════════════════════════════════════════════╝

`;

        // Drag and Drop
        dropZone.addEventListener('dragover', e => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) handleFiles(fileInput.files);
        });

        async function handleFiles(files) {
            const file = files[0];
            if (!file || !file.name.endsWith('.zip')) {
                status.innerHTML = "❌ Solo se aceptan archivos .zip";
                return;
            }

            status.innerHTML = "Procesando... espera un momento 🔥";

            const zip = new JSZip();
            const newZip = new JSZip();

            try {
                const content = await file.arrayBuffer();
                const loadedZip = await zip.loadAsync(content);

                for (const [path, entry] of Object.entries(loadedZip.files)) {
                    if (entry.dir) continue;

                    const data = await entry.async("uint8array");
                    const ext = path.split('.').pop().toLowerCase();
                    let newPath = path;

                    // Renombrar archivo
                    const dir = path.substring(0, path.lastIndexOf('/') + 1);
                    let name = path.substring(path.lastIndexOf('/') + 1);
                    const base = name.substring(0, name.lastIndexOf('.'));
                    const extension = name.substring(name.lastIndexOf('.'));
                    name = `${base} - BY Lynox Hub${extension}`;
                    newPath = dir + name;

                    if (['lua', 'luau', 'txt'].includes(ext)) {
                        let text = new TextDecoder().decode(data);
                        // Eliminar comentarios iniciales
                        const lines = text.split('\n');
                        let i = 0;
                        while (i < lines.length && i < 50) {
                            const trimmed = lines[i].trim();
                            if (trimmed && !trimmed.startsWith('--')) break;
                            i++;
                        }
                        text = lines.slice(i).join('\n');
                        text = WATERMARK + text;
                        newZip.file(newPath, text);
                    } else {
                        newZip.file(newPath, data);
                    }
                }

                // Generar y descargar ZIP
                const blob = await newZip.generateAsync({type: "blob"});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = "Procesado_BY_Lynox_Hub.zip";
                a.click();

                status.innerHTML = "✅ ¡Listo! Archivo descargado con tu marca y renombrado.";

            } catch (err) {
                status.innerHTML = "❌ Error al procesar el ZIP";
                console.error(err);
            }
        }
    </script>
</body>
</html>

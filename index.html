<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Enviar Solo Título Detectado + Adjunto</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #1e1e1e; color: #e0e0e0; }
    input, button { margin: 10px 0; padding: 10px; font-size: 16px; }
    button { background: #5865f2; color: white; border: none; cursor: pointer; border-radius: 5px; }
    button:disabled { background: #3f3f3f; }
    #status { color: #43b581; font-weight: bold; font-size: 16px; }
    #error { color: #f04747; font-size: 14px; }
    h2 { color: #fff; }
    label { font-size: 14px; margin-bottom: 5px; display: block; }
    .webhook-input { margin-bottom: 8px; }
  </style>
</head>
<body>
  <h2>Enviar Solo el Título Detectado + Archivo Adjunto</h2>
  <p>Mensaje limpio: solo el título (sin "Script válido", sin tamaño, sin código).</p>
 
  <label><strong>1. URLs de Webhooks (una por línea - ahora soporta hasta 10):</strong></label>
  <div id="webhookContainer">
    <input type="text" class="webhook-input" placeholder="https://discord.com/api/webhooks/..." style="width:100%;"><br>
    <input type="text" class="webhook-input" placeholder="https://discord.com/api/webhooks/..." style="width:100%;"><br>
    <input type="text" class="webhook-input" placeholder="https://discord.com/api/webhooks/..." style="width:100%;"><br>
    <input type="text" class="webhook-input" placeholder="https://discord.com/api/webhooks/..." style="width:100%;"><br>
    <input type="text" class="webhook-input" placeholder="https://discord.com/api/webhooks/..." style="width:100%;"><br>
    <input type="text" class="webhook-input" placeholder="https://discord.com/api/webhooks/..." style="width:100%;"><br>
    <input type="text" class="webhook-input" placeholder="https://discord.com/api/webhooks/..." style="width:100%;"><br>
    <input type="text" class="webhook-input" placeholder="https://discord.com/api/webhooks/..." style="width:100%;"><br>
    <input type="text" class="webhook-input" placeholder="https://discord.com/api/webhooks/..." style="width:100%;"><br>
    <input type="text" class="webhook-input" placeholder="https://discord.com/api/webhooks/..." style="width:100%;">
  </div>
 
  <label>2. Selecciona la carpeta con los scripts:</label>
  <input type="file" id="folder" webkitdirectory directory multiple><br>
 
  <label>3. Delay entre envíos (ms) – 3000+ recomendado:</label>
  <input type="number" id="delay" value="3000" min="1000" step="500"><br>
 
  <button id="startBtn" onclick="iniciarEnvio()">Comenzar Envío</button>
  <button id="stopBtn" onclick="detenerEnvio()" disabled>Detener Envío</button>
 
  <p id="status">Esperando...</p>
  <p id="error"></p>

  <script>
    let enviando = false;
    let archivosPendientes = [];
    let enviados = new Set();
    let indexActual = 0;
    let webhooks = [];
    let delayMs = 3000;
    const extensionesPermitidas = new Set(['.txt', '.lua']);

    async function iniciarEnvio() {
      delayMs = parseInt(document.getElementById('delay').value) || 3000;

      // Obtener todos los webhooks de los inputs
      const inputs = document.querySelectorAll('.webhook-input');
      webhooks = Array.from(inputs)
        .map(input => input.value.trim())
        .filter(url => url.startsWith('https://discord.com/api/webhooks/'));

      if (webhooks.length === 0) {
        return mostrarError('Ingresa al menos un webhook válido.');
      }

      const folderInput = document.getElementById('folder');
      if (folderInput.files.length === 0) {
        return mostrarError('Selecciona una carpeta.');
      }

      let candidatos = Array.from(folderInput.files).filter(file => {
        const ext = (file.name || '').toLowerCase().slice(file.name.lastIndexOf('.'));
        return extensionesPermitidas.has(ext) && !enviados.has(file.name) && file.size > 0;
      });

      archivosPendientes = [];
      mostrarStatus('Buscando TitleLabel.Text = ... en los archivos...');

      for (let file of candidatos) {
        try {
          const texto = await file.text();
          const match = texto.match(/TitleLabel\.Text\s*=\s*["']?([^"'\n\r;]+)["']?/i);
          if (match && match[1].trim()) {
            file.detectedName = match[1].trim();
            archivosPendientes.push(file);
          }
        } catch (e) {}
      }

      if (archivosPendientes.length === 0) {
        return mostrarError('No se encontraron títulos con TitleLabel.Text = ...');
      }

      enviando = true;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      mostrarStatus(`Encontrados ${archivosPendientes.length} archivos con título. Enviando...`);

      indexActual = 0;
      await procesarEnvio();
    }

    async function procesarEnvio() {
      while (enviando && indexActual < archivosPendientes.length) {
        const file = archivosPendientes[indexActual];
        const webhookIdx = indexActual % webhooks.length;
        const webhook = webhooks[webhookIdx];
        const titulo = file.detectedName || 'Sin título';

        mostrarStatus(`[${indexActual+1}/${archivosPendientes.length}] Enviando ${file.name} → ${titulo}`);

        const formData = new FormData();
        formData.append('payload_json', JSON.stringify({
          content: titulo
        }));
        formData.append('files[0]', file);

        try {
          const res = await fetch(webhook, { method: 'POST', body: formData });
          if (res.ok) {
            enviados.add(file.name);
            mostrarStatus(`Éxito: ${file.name} enviado (${titulo})`);
          } else {
            const errText = await res.text();
            mostrarError(`Error ${res.status} en ${file.name}: ${errText || 'Bad Request'}`);
          }
        } catch (err) {
          mostrarError(`Fallo en ${file.name}: ${err.message}`);
        }

        indexActual++;
        if (enviando && indexActual < archivosPendientes.length) {
          await new Promise(r => setTimeout(r, delayMs));
        }
      }

      if (enviando) mostrarStatus('¡Terminado! Todos enviados.');
      else mostrarStatus('Envío detenido.');

      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    }

    function detenerEnvio() {
      enviando = false;
      mostrarStatus('Deteniendo...');
    }

    function mostrarStatus(msg) {
      document.getElementById('status').textContent = msg;
      document.getElementById('error').textContent = '';
    }

    function mostrarError(msg) {
      document.getElementById('error').textContent = msg;
    }
  </script>
</body>
</html>

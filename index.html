<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>BY Lynox Hub - Subidor Controlado</title>
  <style>
    body {
      margin: 0; padding: 0;
      background: linear-gradient(135deg, #0a001f, #1a0033);
      color: #e0ccff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .header {
      background: rgba(0,0,0,0.9);
      padding: 40px;
      border-bottom: 5px solid #b388ff;
    }
    .header h1 { font-size: 3.5rem; margin: 0; color: #ffdd99; }
    .container { max-width: 900px; margin: 40px auto; padding: 20px; }
    button {
      padding: 15px 30px;
      margin: 10px;
      font-size: 1.2rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .start { background: #00ff88; color: black; }
    .stop { background: #ff4444; color: white; }
    .status {
      margin: 20px 0;
      font-size: 1.4rem;
      padding: 15px;
      border-radius: 10px;
      background: rgba(0,0,0,0.5);
    }
    .log {
      text-align: left;
      background: rgba(0,0,0,0.6);
      padding: 15px;
      height: 300px;
      overflow-y: auto;
      border-radius: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>BY LYNox HUB</h1>
    <p>Subidor Automático con Análisis</p>
  </div>

  <div class="container">
    <button class="start" onclick="iniciarSubida()">▶️ INICIAR SUBIDA</button>
    <button class="stop" onclick="pararSubida()">⏹️ PARAR SUBIDA</button>

    <div class="status" id="status">Listo - Presiona INICIAR SUBIDA</div>
    <div class="log" id="log"></div>
  </div>

  <script>
    // ==================== TUS 5 WEBHOOKS POR DEFAULT ====================
    const WEBHOOKS = [
      "https://discord.com/api/webhooks/1486122112279380090/j132bUxCqLMKb57s2xrweYmm5JLuNsduZsxB40zW80LpFPypTP8AWbPgtu-KriiUzZO_",
      "https://discord.com/api/webhooks/1486122086333284384/7o-sx0edLlk-jvvFP1ViZmhReisObyrtTYudUrnSlU0iJg7jgFHQNhOfRm0AEy_8g3nY",
      "https://discord.com/api/webhooks/1486122104322785390/b91WG6wQAKdjFa8wcl4wBNLvKBJ3mJGCzYF9N_1x0IsKvKYNO4slZgEiFbEnY_Drk0gn",
      "https://discord.com/api/webhooks/1486122109569728602/zaau7raVP_u89hmesp3ovdPXonqRVOr9zDd6mJB0PexGr7zJTxUoHbBeTuua21ZGJL35",
      "https://discord.com/api/webhooks/1486122112279380090/j132bUxCqLMKb57s2xrweYmm5JLuNsduZsxB40zW80LpFPypTP8AWbPgtu-KriiUzZO_"
    ];

    let estaCorriendo = false;
    let indiceActual = 0;

    // ==================== LISTA DE ARCHIVOS (agrega aquí los tuyos) ====================
    const archivos = [
      "Infinite Yield - BY Lynox Hub.lua",
      "ESP + Aimbot - BY Lynox Hub.lua",
      "Auto Grap - BY Lynox Hub.lua",
      "Semi Steal Hub - BY Lynox Hub.lua",
      "FPS Killer - BY Lynox Hub.lua",
      "Server Joiner - BY Lynox Hub.lua",
      "Steal Hub v2 - BY Lynox Hub.lua",
      // Agrega más archivos aquí abajo:
      // "Nombre de tu archivo.lua",
    ];

    function analizarYEnviar(index) {
      if (!estaCorriendo || index >= archivos.length) {
        document.getElementById('status').innerHTML = "✅ Subida completada o detenida";
        return;
      }

      const archivo = archivos[index];
      const webhook = WEBHOOKS[index % WEBHOOKS.length];

      let emoji = "📜";
      let desc = "Script optimizado por Lynox Hub";

      const n = archivo.toLowerCase();
      if (n.includes("esp")) { emoji = "👁️"; desc = "ESP - Muestra jugadores a través de paredes"; }
      else if (n.includes("aimbot") || n.includes("aim")) { emoji = "🎯"; desc = "Aimbot - Apunta automáticamente"; }
      else if (n.includes("grap")) { emoji = "🪝"; desc = "Auto Grap - Agarra objetos automáticamente"; }
      else if (n.includes("steal")) { emoji = "💰"; desc = "Stealer - Roba información"; }
      else if (n.includes("semi steal")) { emoji = "🪙"; desc = "Semi Steal - Versión más segura"; }
      else if (n.includes("hub") || n.includes("menu")) { emoji = "📋"; desc = "Hub / Menú completo"; }
      else if (n.includes("fps killer") || n.includes("fps")) { emoji = "💥"; desc = "FPS Killer - Reduce FPS de otros"; }
      else if (n.includes("joiner")) { emoji = "🚪"; desc = "Joiner - Se une a servidores automáticamente"; }

      // 1. Enviar descripción con sticker
      fetch(webhook, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          content: `**${emoji} ${archivo}**\n**BY Lynox Hub**\n\n📌 Para qué sirve:\n${desc}\n\n🔗 https://discord.gg/q8NEM7pPrW`
        })
      });

      agregarLog(`📝 Descripción enviada → ${archivo}`);

      setTimeout(() => {
        // 2. Enviar el archivo
        agregarLog(`📤 Subiendo archivo → ${archivo}`);
        
        // Aquí iría la subida real del archivo, pero como es solo HTML, mostramos mensaje
        setTimeout(() => {
          agregarLog(`✅ Archivo enviado → ${archivo}`);
          analizarYEnviar(index + 1);
        }, 4000);
      }, 6000);
    }

    function agregarLog(texto) {
      const log = document.getElementById('log');
      log.innerHTML += texto + "<br>";
      log.scrollTop = log.scrollHeight;
    }

    function iniciarSubida() {
      if (estaCorriendo) return;
      estaCorriendo = true;
      document.getElementById('status').innerHTML = "🚀 Subida en progreso...";
      indiceActual = 0;
      analizarYEnviar(0);
    }

    function pararSubida() {
      estaCorriendo = false;
      document.getElementById('status').innerHTML = "⏹️ Subida detenida por el usuario";
    }

    // Iniciar log
    document.getElementById('log').innerHTML = "Web cargada - Listo para subir<br>";
  </script>

  <div class="container">
    <div class="log" id="log"></div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Enviar Scripts Lua/TXT con Código Visible + Nombre Original</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #1e1e1e; color: #e0e0e0; }
    input, button { margin: 10px 0; padding: 10px; font-size: 16px; }
    button { background: #5865f2; color: white; border: none; cursor: pointer; border-radius: 5px; }
    button:disabled { background: #3f3f3f; }
    #status { color: #43b581; font-weight: bold; font-size: 16px; }
    #error { color: #f04747; font-size: 14px; }
    h2 { color: #fff; }
    label { font-size: 14px; margin-bottom: 5px; display: block; }
  </style>
</head>
<body>
  <h2>Enviar Archivos (Lua/TXT) → Discord con Código Visible + Nombre Original</h2>
  
  <label>1. URLs de Webhooks (separadas por coma):</label>
  <input type="text" id="webhooks" size="100" placeholder="https://discord.com/api/webhooks/... , https://..."><br>
  
  <label>2. Selecciona la carpeta con los scripts:</label>
  <input type="file" id="folder" webkitdirectory directory multiple><br>
  
  <label>3. Delay entre envíos (ms) – 1500 recomendado para evitar ratelimit:</label>
  <input type="number" id="delay" value="1500" min="500" step="100"><br>
  
  <button id="startBtn" onclick="iniciarEnvio()">Comenzar Envío</button>
  <button id="stopBtn" onclick="detenerEnvio()" disabled>Detener Envío</button>
  
  <p id="status">Esperando...</p>
  <p id="error"></p>

  <script>
    let enviando = false;
    let archivosPendientes = [];
    let enviados = new Set(); // Evita duplicados por nombre
    let indexActual = 0;
    let webhooks = [];
    let delayMs = 1500;

    const extensionesPermitidas = new Set([
      '.txt', '.lua', '.json', '.js', '.cfg', '.ini', '.log'
    ]);

    async function iniciarEnvio() {
      const webhooksStr = document.getElementById('webhooks').value.trim();
      delayMs = parseInt(document.getElementById('delay').value) || 1500;
      const folderInput = document.getElementById('folder');

      if (!webhooksStr) return mostrarError('Ingresa al menos un webhook válido.');
      webhooks = webhooksStr.split(',').map(u => u.trim()).filter(u => u.startsWith('https://discord.com/api/webhooks/'));

      if (webhooks.length === 0) return mostrarError('Webhooks inválidos.');
      if (folderInput.files.length === 0) return mostrarError('Selecciona una carpeta.');

      archivosPendientes = Array.from(folderInput.files).filter(file => {
        const ext = (file.name || '').toLowerCase().slice(file.name.lastIndexOf('.'));
        return extensionesPermitidas.has(ext) && !enviados.has(file.name);
      });

      if (archivosPendientes.length === 0) return mostrarError('No hay archivos válidos (txt/lua/etc) nuevos.');

      enviando = true;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      mostrarStatus(`Preparando ${archivosPendientes.length} archivos...`);

      indexActual = 0;
      await procesarEnvio();
    }

    async function procesarEnvio() {
      while (enviando && indexActual < archivosPendientes.length) {
        const file = archivosPendientes[indexActual];
        const webhookIdx = indexActual % webhooks.length;
        const webhook = webhooks[webhookIdx];

        mostrarStatus(`[${indexActual+1}/${archivosPendientes.length}] Leyendo y enviando ${file.name}...`);

        // Leer contenido como texto
        let contenido = '';
        try {
          contenido = await file.text();
        } catch (e) {
          mostrarError(`No se pudo leer ${file.name}: ${e.message}`);
          indexActual++;
          continue;
        }

        const formData = new FormData();
        // Mensaje con código visible
        formData.append('payload_json', JSON.stringify({
          content: `**Archivo:** ${file.name}\n\`\`\`lua\n${contenido}\n\`\`\``
        }));
        // Adjuntar el archivo con SU NOMBRE ORIGINAL
        formData.append('files[]', file);

        try {
          const res = await fetch(webhook, { method: 'POST', body: formData });
          if (res.ok) {
            enviados.add(file.name);
            mostrarStatus(`Éxito: ${file.name} enviado (con código visible)`);
          } else {
            mostrarError(`Error ${res.status} en ${file.name}`);
          }
        } catch (err) {
          mostrarError(`Fallo en ${file.name}: ${err.message}`);
        }

        indexActual++;
        if (enviando && indexActual < archivosPendientes.length) {
          await new Promise(r => setTimeout(r, delayMs));
        }
      }

      if (enviando) {
        mostrarStatus(`¡Completado! Enviados ${enviados.size} archivos.`);
      } else {
        mostrarStatus('Envío detenido.');
      }
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    }

    function detenerEnvio() {
      enviando = false;
      mostrarStatus('Deteniendo... (termina el envío actual)');
    }

    function mostrarStatus(msg) {
      document.getElementById('status').textContent = msg;
      document.getElementById('error').textContent = '';
    }

    function mostrarError(msg) {
      document.getElementById('error').textContent = msg;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Enviar Archivos a Webhooks - Solo Adjunto</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1e1e2e;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #25253a;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      text-align: center;
      color: #7289da;
    }
    .webhook-list {
      margin: 20px 0;
    }
    .webhook-item {
      background: #1e1e2e;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .webhook-item input {
      flex: 1;
      background: #2f2f45;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
    }
    label {
      display: block;
      margin: 15px 0 8px;
      color: #b9bbbe;
    }
    input[type="file"], input[type="number"] {
      width: 100%;
      padding: 12px;
      background: #1e1e2e;
      color: white;
      border-radius: 8px;
      border: 1px solid #5865f2;
    }
    button {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    .start-btn { background: #5865f2; color: white; }
    .stop-btn { background: #f04747; color: white; }
    .add-btn { background: #43b581; color: white; padding: 10px; border-radius: 8px; border: none; cursor: pointer; }

    .status {
      margin-top: 20px;
      padding: 16px;
      background: #1e1e2e;
      border-radius: 10px;
      min-height: 60px;
      font-size: 16px;
    }
    .success { color: #43b581; }
    .error { color: #f04747; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📤 Solo Enviar Archivos (Sin Texto)</h1>
    
    <label>1. Webhooks (uno por línea / apartado)</label>
    <div class="webhook-list" id="webhookList"></div>
    <button class="add-btn" onclick="agregarWebhook()">+ Agregar Webhook</button>

    <label>2. Selecciona la carpeta con los archivos</label>
    <input type="file" id="folder" webkitdirectory directory multiple>

    <label>3. Delay entre envíos (ms)</label>
    <input type="number" id="delay" value="2500" min="1000" step="200">

    <button class="start-btn" id="startBtn" onclick="iniciarEnvio()">🚀 COMENZAR ENVÍO</button>
    <button class="stop-btn" id="stopBtn" onclick="detenerEnvio()" disabled>⏹ DETENER ENVÍO</button>

    <div class="status" id="status">Listo • Solo se enviarán los archivos adjuntos (sin texto)</div>
  </div>

  <script>
    function agregarWebhook() {
      const list = document.getElementById('webhookList');
      const div = document.createElement('div');
      div.className = 'webhook-item';
      div.innerHTML = `
        <input type="text" placeholder="https://discord.com/api/webhooks/...">
        <button onclick="this.parentElement.remove()" style="background:#f04747;color:white;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;">Eliminar</button>
      `;
      list.appendChild(div);
    }

    function obtenerWebhooks() {
      return Array.from(document.querySelectorAll('.webhook-item input'))
                  .map(input => input.value.trim())
                  .filter(url => url.startsWith('https://discord.com/api/webhooks/'));
    }

    let enviando = false;
    let archivosPendientes = [];
    let enviados = new Set();
    let indexActual = 0;
    let webhooks = [];
    let delayMs = 2500;

    async function iniciarEnvio() {
      webhooks = obtenerWebhooks();
      delayMs = parseInt(document.getElementById('delay').value) || 2500;

      if (webhooks.length === 0) return mostrarError('Agrega al menos un webhook.');

      const folderInput = document.getElementById('folder');
      if (folderInput.files.length === 0) return mostrarError('Selecciona una carpeta.');

      // Solo archivos .txt y .lua
      archivosPendientes = Array.from(folderInput.files).filter(file => 
        (file.name.endsWith('.txt') || file.name.endsWith('.lua')) && 
        file.size > 0 && !enviados.has(file.name)
      );

      if (archivosPendientes.length === 0) 
        return mostrarError('No hay archivos .txt o .lua en la carpeta.');

      // Reparto equitativo
      archivosPendientes = repartirEquitativamente(archivosPendientes, webhooks.length);

      enviando = true;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;

      mostrarStatus(`Preparando ${archivosPendientes.length} archivos...\nSolo se enviarán los adjuntos (sin texto)`);

      indexActual = 0;
      await procesarEnvio();
    }

    function repartirEquitativamente(archivos, numWebhooks) {
      const grupos = Array.from({length: numWebhooks}, () => []);
      archivos.forEach((archivo, i) => {
        grupos[i % numWebhooks].push(archivo);
      });
      return grupos.flat();
    }

    async function procesarEnvio() {
      const total = archivosPendientes.length;

      while (enviando && indexActual < total) {
        const file = archivosPendientes[indexActual];
        const webhookIndex = indexActual % webhooks.length;
        const webhook = webhooks[webhookIndex];

        mostrarStatus(`Enviando archivo ${indexActual + 1}/${total} → ${file.name} (Webhook ${webhookIndex + 1})`);

        const formData = new FormData();
        // Sin texto → solo el archivo
        formData.append('payload_json', JSON.stringify({ content: "" }));
        formData.append('files[0]', file);

        try {
          const res = await fetch(webhook, { method: 'POST', body: formData });
          if (res.ok) {
            enviados.add(file.name);
            mostrarStatus(`✅ Archivo enviado: ${file.name}`, 'success');
          } else {
            mostrarError(`Error ${res.status} al enviar ${file.name}`);
          }
        } catch (err) {
          mostrarError(`Error de conexión al enviar ${file.name}`);
        }

        indexActual++;
        if (enviando && indexActual < total) {
          await new Promise(r => setTimeout(r, delayMs));
        }
      }

      if (enviando) mostrarStatus(`¡Terminado!\nSe enviaron ${enviados.size} archivos solo como adjuntos.`, 'success');
      else mostrarStatus('Envío detenido.');

      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    }

    function detenerEnvio() {
      enviando = false;
      mostrarStatus('Deteniendo envío...');
    }

    function mostrarStatus(texto, tipo = '') {
      const el = document.getElementById('status');
      el.innerHTML = texto.replace(/\n/g, '<br>');
      if (tipo === 'success') el.className = 'status success';
      else if (tipo === 'error') el.className = 'status error';
      else el.className = 'status';
    }

    function mostrarError(texto) {
      const el = document.getElementById('status');
      el.textContent = texto;
      el.className = 'status error';
    }

    // Iniciar con un webhook
    window.onload = () => agregarWebhook();
  </script>
</body>
</html>
